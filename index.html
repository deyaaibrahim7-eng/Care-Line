  ['\u0627\u0634\u0631\u062d\u0647 \u0628\u0643\u0644\u0645\u0627\u062a\u0643', '\u0628\u0639\u062f \u0627\u0644\u0634\u0631\u062d \u062a\u062d\u0643\u064a \u0644\u0646\u0627 \u0627\u0633\u0645 \u0627\u0644\u062f\u0648\u0627\u0621 \u0648\u0633\u0628\u0628 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647 \u0648\u0645\u0648\u0639\u062f\u0647\u060c \u0641\u0646\u062a\u0623\u0643\u062f \u0623\u0646 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0629 \u0648\u0635\u0644\u062a.', '\u062a\u0634\u0631\u062d \u0628\u0628\u0633\u0627\u0637\u0629\u060c \u0648\u062a\u0637\u0644\u0628 \u0645\u0646\u0643 \u0625\u0639\u0627\u062f\u0629 \u0627\u0644\u0634\u0631\u062d\u060c \u0648\u062a\u0635\u062d\u062d \u0628\u0631\u0641\u0642.', '\u0623\u062c\u0628 \u0628\u0643\u0644\u0645\u0627\u062a\u0643 \u062f\u0648\u0646 \u062d\u0641\u0638.'],
  ['\u062a\u0628\u0633\u064a\u0637 \u0627\u0644\u062c\u062f\u0648\u0644', '\u0643\u0644\u0645\u0627 \u0642\u0644\u0651\u062a \u0645\u0631\u0627\u062a \u0627\u0644\u062f\u0648\u0627\u0621 \u0641\u064a \u0627\u0644\u064a\u0648\u0645 \u0632\u0627\u062f \u0627\u0644\u0627\u0646\u062a\u0638\u0627\u0645.', '\u062a\u0631\u0627\u062c\u0639 \u0627\u0644\u062c\u062f\u0648\u0644 \u0648\u062a\u0633\u0623\u0644 \u0627\u0644\u0637\u0628\u064a\u0628 \u0639\u0646 \u0623\u0642\u0631\u0627\u0635 \u0645\u062c\u0645\u0651\u0639\u0629 \u0623\u0648 \u062c\u0631\u0639\u0629 \u064a\u0648\u0645\u064a\u0629 \u0648\u0627\u062d\u062f\u0629.', '\u0633\u062c\u0651\u0644 \u0623\u062f\u0648\u064a\u062a\u0643 \u0641\u064a \u0635\u0641\u062d\u0629 \u00ab\u0623\u062f\u0648\u064a\u062a\u064a\u00bb.'],
  ['\u062a\u0646\u0638\u064a\u0645 \u0627\u0644\u062f\u0648\u0627\u0621', '\u0639\u0644\u0628\u0629 \u0623\u0633\u0628\u0648\u0639\u064a\u0629 \u0645\u0642\u0633\u0651\u0645\u0629 \u0625\u0644\u0649 \u0635\u0628\u0627\u062d \u0648\u0638\u0647\u0631 \u0648\u0645\u0633\u0627\u0621\u060c \u0623\u0648 \u0634\u0631\u0627\u0626\u0637 \u062c\u0627\u0647\u0632\u0629 \u0645\u0646 \u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0629.', '\u062a\u0633\u0627\u0639\u062f\u0643 \u0639\u0644\u0649 \u0625\u0639\u062f\u0627\u062f \u0627\u0644\u0639\u0644\u0628\u0629 \u0623\u0648\u0644 \u0645\u0631\u0629 \u0648\u062a\u0631\u0627\u062c\u0639\u0647\u0627 \u0645\u0639\u0643.', '\u062c\u0647\u0651\u0632 \u0627\u0644\u0639\u0644\u0628\u0629 \u0641\u064a \u064a\u0648\u0645 \u062b\u0627\u0628\u062a \u0643\u0644 \u0623\u0633\u0628\u0648\u0639.'],
  ['\u0642\u064a\u0627\u0633 \u0627\u0644\u0636\u063a\u0637 \u0641\u064a \u0627\u0644\u0645\u0646\u0632\u0644', '\u0642\u0631\u0627\u0621\u0629 \u064a\u0648\u0645\u064a\u0629 \u0641\u064a \u0627\u0644\u0648\u0642\u062a \u0646\u0641\u0633\u0647\u060c \u062a\u0634\u0627\u0631\u0643\u0647\u0627 \u0645\u0639 \u0627\u0644\u0645\u0645\u0631\u0636\u0629.', '\u062a\u062a\u0627\u0628\u0639 \u0627\u0644\u0642\u0631\u0627\u0621\u0627\u062a \u0648\u062a\u064f\u0628\u0644\u063a \u0627\u0644\u0637\u0628\u064a\u0628 \u0639\u0646\u062f \u0627\u0631\u062a\u0641\u0627\u0639 \u0645\u062a\u0643\u0631\u0631 \u0623\u0648 \u0627\u0646\u062e\u0641\u0627\u0636.', '\u0633\u062c\u0651\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0647\u0646\u0627 \u0643\u0644 \u064a\u0648\u0645.'],
  ['\u0639\u0644\u0627\u062c \u0627\u0644\u0623\u0639\u0631\u0627\u0636 \u062f\u0648\u0646 \u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u062f\u0648\u0627\u0621', '\u0625\u0630\u0627 \u0623\u062a\u0639\u0628\u0643 \u0627\u0644\u062f\u0648\u0627\u0621 \u0641\u0627\u0644\u062d\u0644 \u0623\u0646 \u0646\u063a\u064a\u0651\u0631\u0647 \u0645\u0639 \u0627\u0644\u0637\u0628\u064a\u0628\u060c \u0644\u0627 \u0623\u0646 \u062a\u0648\u0642\u0641\u0647.', '\u062a\u0633\u062c\u0651\u0644 \u0627\u0644\u0639\u064e\u0631\u064e\u0636 \u0628\u0627\u0644\u062a\u0641\u0635\u064a\u0644 \u0648\u062a\u0639\u0631\u0636\u0647 \u0639\u0644\u0649 \u0627\u0644\u0637\u0628\u064a\u0628 \u0633\u0631\u064a\u0639\u064b\u0627.', '\u0623\u062e\u0628\u0631\u0646\u0627 \u0628\u0627\u0644\u0639\u064e\u0631\u064e\u0636 \u0641\u0648\u0631 \u0638\u0647\u0648\u0631\u0647.'],
  ['\u062a\u0634\u062c\u064a\u0639 \u0648\u0645\u062a\u0627\u0628\u0639\u0629', '\u062a\u062a\u0628\u0651\u0639 \u0627\u0644\u0623\u064a\u0627\u0645 \u0627\u0644\u0645\u062a\u062a\u0627\u0644\u064a\u0629 \u0648\u0627\u0644\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0623\u0633\u0628\u0648\u0639\u064a\u0629 \u064a\u0628\u0646\u064a\u0627\u0646 \u0627\u0644\u0639\u0627\u062f\u0629.', '\u062a\u0631\u0627\u062c\u0639 \u0627\u0644\u062a\u0632\u0627\u0645\u0643 \u0645\u0639\u0643 \u0643\u0644 \u0623\u0633\u0628\u0648\u0639 \u0648\u062a\u064f\u0642\u062f\u0651\u0631 \u062a\u0642\u062f\u0651\u0645\u0643.', '\u062a\u0627\u0628\u0639 \u0633\u0644\u0633\u0644\u0629 \u0623\u064a\u0627\u0645\u0643 \u0641\u064a \u0627\u0644\u0635\u0641\u062d\u0629 \u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629.'],
  ['\u0645\u0634\u0627\u0631\u0643\u0629 \u0623\u062d\u062f \u0623\u0641\u0631\u0627\u062f \u0627\u0644\u0623\u0633\u0631\u0629', '\u0648\u062c\u0648\u062f \u0645\u0646 \u064a\u0630\u0643\u0651\u0631\u0643 \u0641\u064a \u0627\u0644\u0645\u0646\u0632\u0644 \u064a\u0642\u0644\u0651\u0644 \u0627\u0644\u0646\u0633\u064a\u0627\u0646 \u0643\u062b\u064a\u0631\u064b\u0627.', '\u062a\u0634\u0631\u062d \u0627\u0644\u062e\u0637\u0629 \u0644\u0623\u062d\u062f \u0623\u0641\u0631\u0627\u062f \u0623\u0633\u0631\u062a\u0643.', '\u0623\u0637\u0644\u0650\u0639 \u0642\u0631\u064a\u0628\u064b\u0627 \u0644\u0643 \u0639\u0644\u0649 \u062e\u0637\u062a\u0643.'],

      <fieldset class="fs"><legend>\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u0645\u064a\u0644\u0627\u062f</legend>${birthSelects('u', '')}<small class="muted">\u064a\u064f\u062d\u0633\u0628 \u0633\u0646\u0651\u0643 \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627 \u0645\u0646 \u062a\u0627\u0631\u064a\u062e \u0645\u064a\u0644\u0627\u062f\u0643.</small></fieldset>
      <label class="f">\u0631\u0642\u0645 \u0627\u0644\u0645\u0648\u0628\u0627\u064a\u0644 (\u0628\u0647 \u062a\u062f\u062e\u0644 \u0627\u0644\u0645\u0648\u0642\u0639 \u0641\u064a \u0643\u0644 \u0645\u0631\u0629)<input type="tel" id="up" inputmode="tel" dir="ltr" style="text-align:right" autocomplete="tel" placeholder="01012345678" value="${esc(phone)}"></label>
      <fieldset class="fs"><legend>\u0647\u0644 \u0644\u062f\u064a\u0643 \u0631\u0642\u0645 \u0622\u062e\u0631 \u0644\u0644\u0648\u0627\u062a\u0633\u0627\u0628\u060c \u0623\u0645 \u0647\u0648 \u0646\u0641\u0633 \u0631\u0642\u0645 \u0645\u0648\u0628\u0627\u064a\u0644\u0643\u061f</legend>
        <div class="togs" role="radiogroup" aria-label="\u0631\u0642\u0645 \u0627\u0644\u0648\u0627\u062a\u0633\u0627\u0628">
          <label class="tog"><input type="radio" name="uwa" value="yes"><span>\u0646\u0639\u0645\u060c \u0631\u0642\u0645 \u0622\u062e\u0631</span></label>
          <label class="tog"><input type="radio" name="uwa" value="no" checked><span>\u0644\u0627\u060c \u0646\u0641\u0633 \u0627\u0644\u0631\u0642\u0645</span></label></div></fieldset>
      <label class="f" id="uwl" hidden>\u0631\u0642\u0645 \u0627\u0644\u0648\u0627\u062a\u0633\u0627\u0628<input type="tel" id="uw" inputmode="tel" dir="ltr" style="text-align:right" placeholder="01012345678"></label>
      <label class="chk"><input type="checkbox" id="uc"><span>\u0623\u0648\u0627\u0641\u0642 \u0639\u0644\u0649 \u0623\u0646 \u062a\u0637\u0651\u0644\u0639 \u0627\u0644\u0645\u0645\u0631\u0636\u0629 \u0639\u0644\u0649 \u0628\u064a\u0627\u0646\u0627\u062a \u0623\u062f\u0648\u064a\u062a\u064a \u0648\u0642\u0631\u0627\u0621\u0627\u062a \u0636\u063a\u0637\u064a \u0644\u0645\u062a\u0627\u0628\u0639\u062a\u064a.</span></label>
      <p class="note" id="ue" role="alert" hidden></p>
      <button class="btn main big" id="ub" type="submit">\u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u062d\u0633\u0627\u0628</button></form>`}`, d => {
    $('#tIn', d).onclick = () => showAuth('in'); $('#tUp', d).onclick = () => showAuth('up');
    const lf = $('#lf', d), uf = $('#uf', d);
    if (lf) {
      $('#li', d).focus();
      lf.addEventListener('submit', async e => {
        e.preventDefault();
        const err = $('#le', d); err.hidden = true;
        const phone = normPhone($('#li', d).value);
        if (!phone) { err.textContent = '\u0627\u0643\u062a\u0628 \u0631\u0642\u0645 \u0645\u0648\u0628\u0627\u064a\u0644 \u0635\u062d\u064a\u062d\u064b\u0627\u060c \u0645\u062b\u0644 01012345678.'; err.hidden = false; return; }
        const btn = $('#lb', d); btn.disabled = true;
        try { await enter(await DB.signIn(phone, patientPw(phone))); }
        catch (ex) {
          if (ex.code === 'bad_credentials') { showAuth('up', phone, ''); const u = $('#ue'); if (u) { u.textContent = '\u0647\u0630\u0627 \u0627\u0644\u0631\u0642\u0645 \u063a\u064a\u0631 \u0645\u0633\u062c\u0651\u0644 \u0628\u0639\u062f. \u0623\u0643\u0645\u0644 \u0628\u064a\u0627\u0646\u0627\u062a\u0643 \u0644\u0625\u0646\u0634\u0627\u0621 \u062d\u0633\u0627\u0628\u0643.'; u.hidden = false; u.classList.remove('bad'); } return; }
          console.error(ex); btn.disabled = false; err.textContent = authMsg(ex); err.hidden = false;
        }
      });
    }
    if (uf) {
      const wl = $('#uwl', d);
      $$('input[name=uwa]', d).forEach(r => r.addEventListener('change', () => { const yes = $('input[name=uwa]:checked', d).value === 'yes'; wl.hidden = !yes; if (yes) $('#uw', d).focus(); }));
      uf.addEventListener('submit', async e => {
        e.preventDefault();
        $$('[aria-invalid]', d).forEach(x => x.removeAttribute('aria-invalid')); $('#ue', d).hidden = true;
        const F = (el, m) => fieldFail(d, el, m, 'ue');
        const name = $('#un', d).value.trim().replace(/\s+/g, ' ');
        if (name.split(' ').filter(w => w.length > 1).length < 4) return F($('#un', d), '\u0627\u0643\u062a\u0628 \u0627\u0633\u0645\u0643 \u0631\u0628\u0627\u0639\u064a\u064b\u0627: \u0627\u0633\u0645\u0643 \u0648\u0627\u0633\u0645 \u0623\u0628\u064a\u0643 \u0648\u062c\u062f\u0643 \u0648\u062c\u062f \u0623\u0628\u064a\u0643.');
        const birth = readBirth(d, 'u');
        if (!birth) return F($('#ubd', d), '\u0627\u062e\u062a\u0631 \u062a\u0627\u0631\u064a\u062e \u0645\u064a\u0644\u0627\u062f\u0643 \u0643\u0627\u0645\u0644\u064b\u0627 (\u0627\u0644\u064a\u0648\u0645 \u0648\u0627\u0644\u0634\u0647\u0631 \u0648\u0627\u0644\u0633\u0646\u0629).');
        const phone = normPhone($('#up', d).value);
        if (!phone) return F($('#up', d), '\u0627\u0643\u062a\u0628 \u0631\u0642\u0645 \u0645\u0648\u0628\u0627\u064a\u0644 \u0635\u062d\u064a\u062d\u064b\u0627\u060c \u0645\u062b\u0644 01012345678.');
        let wa = phone;
        if ($('input[name=uwa]:checked', d).value === 'yes') { wa = normPhone($('#uw', d).value); if (!wa) return F($('#uw', d), '\u0627\u0643\u062a\u0628 \u0631\u0642\u0645 \u0627\u0644\u0648\u0627\u062a\u0633\u0627\u0628 \u0635\u062d\u064a\u062d\u064b\u0627\u060c \u0645\u062b\u0644 01012345678.'); }
        if (!$('#uc', d).checked) return F($('#uc', d), '\u0644\u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u062d\u0633\u0627\u0628 \u0646\u062d\u062a\u0627\u062c \u0625\u0644\u0649 \u0645\u0648\u0627\u0641\u0642\u062a\u0643 \u0639\u0644\u0649 \u0627\u0637\u0644\u0627\u0639 \u0627\u0644\u0645\u0645\u0631\u0636\u0629 \u0639\u0644\u0649 \u0628\u064a\u0627\u0646\u0627\u062a\u0643.');
        const btn = $('#ub', d); btn.disabled = true;
        try { await enter(await DB.signUp({ name, birth, phone, wa, password: patientPw(phone) }), true); }
        catch (ex) {
          console.error(ex); btn.disabled = false;
          if (ex.code === 'exists') { showAuth('in', phone, '\u0647\u0630\u0627 \u0627\u0644\u0631\u0642\u0645 \u0645\u0633\u062c\u0651\u0644 \u0645\u0646 \u0642\u0628\u0644. \u0627\u0636\u063a\u0637 \u00ab\u062f\u062e\u0648\u0644\u00bb \u0644\u0644\u0645\u062a\u0627\u0628\u0639\u0629.'); return; }
          F(null, authMsg(ex));
        }
      });
    }
  });
}

/* ===== \u0645\u0644\u0641\u064a ===== */
function openProfile() {
  openDlg(`<h2 id="dlgT">\u0645\u0644\u0641\u064a</h2>
    <div class="idcard"><div class="logo" aria-hidden="true">${ico('user')}</div><div class="grow"><b style="font-size:1.2rem">${esc(S.name)}</b>
      <div class="muted">\u0627\u0644\u0633\u0646: <b>${myAge() ?? '\u2014'}</b> \u0633\u0646\u0629 \u00b7 \u0648\u064f\u0644\u062f\u062a \u0641\u064a ${esc(S.birth ? fmtBirth(S.birth) : '\u2014')}</div>
      <div class="muted" dir="ltr" style="text-align:right">${esc(S.phone)}</div></div></div>
    <form id="pf" class="stack" style="margin-top:1rem" novalidate>
      <label class="f">\u0627\u0644\u0627\u0633\u0645 \u0627\u0644\u0631\u0628\u0627\u0639\u064a<input type="text" id="pn" value="${esc(S.name)}" autocomplete="name"></label>
      <fieldset class="fs"><legend>\u062a\u0627\u0631\u064a\u062e \u0627\u0644\u0645\u064a\u0644\u0627\u062f</legend>${birthSelects('p', S.birth)}</fieldset>
      <label class="f">\u0631\u0642\u0645 \u0627\u0644\u0648\u0627\u062a\u0633\u0627\u0628<input type="tel" id="pw" inputmode="tel" dir="ltr" style="text-align:right" value="${esc(S.wa)}"></label>
      <p class="muted" style="font-size:.9rem;margin:0">\u0631\u0642\u0645 \u0627\u0644\u0645\u0648\u0628\u0627\u064a\u0644 \u0647\u0648 \u0645\u0641\u062a\u0627\u062d \u062f\u062e\u0648\u0644\u0643 \u0625\u0644\u0649 \u0627\u0644\u062d\u0633\u0627\u0628\u060c \u0648\u0644\u0627 \u064a\u0645\u0643\u0646 \u062a\u063a\u064a\u064a\u0631\u0647 \u0645\u0646 \u0647\u0646\u0627.</p>
      <fieldset class="fs"><legend>\u062d\u062c\u0645 \u0627\u0644\u062e\u0637</legend><div class="togs">${[1, 2, 3].map(n => `<label class="tog"><input type="radio" name="sz" value="${n}" ${S.scale === n ? 'checked' : ''}><span>${SIZE_LBL[n]}</span></label>`).join('')}</div></fieldset>
      <fieldset class="fs"><legend>\u0634\u0643\u0644 \u0627\u0644\u0634\u0627\u0634\u0629</legend><div class="togs">${[['auto', '\u062a\u0644\u0642\u0627\u0626\u064a'], ['light', '\u0641\u0627\u062a\u062d'], ['dark', '\u062f\u0627\u0643\u0646']].map(t => `<label class="tog"><input type="radio" name="th" value="${t[0]}" ${S.theme === t[0] ? 'checked' : ''}><span>${t[1]}</span></label>`).join('')}</div></fieldset>
      <p class="note" id="pe" role="alert" hidden></p>
      <div class="row"><button class="btn main" id="ps" type="submit">\u062d\u0641\u0638</button><button class="btn" type="button" data-close>\u0625\u063a\u0644\u0627\u0642</button></div>
      <hr class="sep"><button class="btn danger" type="button" data-act="logout">\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062e\u0631\u0648\u062c</button>
    </form>`, d => {
    $$('input[name=sz],input[name=th]', d).forEach(i => i.addEventListener('change', () => {
      S.scale = +$('input[name=sz]:checked', d).value; S.theme = $('input[name=th]:checked', d).value; saveUi(); applyPrefs();
    }));
    $('#pf', d).addEventListener('submit', async e => {
      e.preventDefault();
      $$('[aria-invalid]', d).forEach(x => x.removeAttribute('aria-invalid')); $('#pe', d).hidden = true;
      const F = (el, m) => fieldFail(d, el, m, 'pe');
      const name = $('#pn', d).value.trim().replace(/\s+/g, ' ');
      if (name.split(' ').filter(w => w.length > 1).length < 4) return F($('#pn', d), '\u0627\u0643\u062a\u0628 \u0627\u0633\u0645\u0643 \u0631\u0628\u0627\u0639\u064a\u064b\u0627.');
      const birth = readBirth(d, 'p'); if (!birth) return F($('#pbd', d), '\u0627\u062e\u062a\u0631 \u062a\u0627\u0631\u064a\u062e \u0645\u064a\u0644\u0627\u062f\u0643 \u0643\u0627\u0645\u0644\u064b\u0627.');
      const wa = normPhone($('#pw', d).value); if (!wa) return F($('#pw', d), '\u0627\u0643\u062a\u0628 \u0631\u0642\u0645 \u0648\u0627\u062a\u0633\u0627\u0628 \u0635\u062d\u064a\u062d\u064b\u0627\u060c \u0645\u062b\u0644 01012345678.');
      const btn = $('#ps', d); btn.disabled = true;
      try { await DB.updateProfile(S.id, { name, birth, wa }); Object.assign(S, { name, birth, wa }); closeDlg(); toast('\u062a\u0645 \u062d\u0641\u0638 \u0628\u064a\u0627\u0646\u0627\u062a\u0643'); render(); }
      catch (ex) { console.error(ex); btn.disabled = false; F(null, errText(ex)); }
    });
  });
}
ACT.logout = async () => {
  if (!await confirmDlg('\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062e\u0631\u0648\u062c\u061f', '\u064a\u0645\u0643\u0646\u0643 \u0627\u0644\u062f\u062e\u0648\u0644 \u0645\u062c\u062f\u062f\u064b\u0627 \u0628\u0631\u0642\u0645 \u0627\u0644\u0645\u0648\u0628\u0627\u064a\u0644.', '\u062e\u0631\u0648\u062c')) return;
  try { await DB.signOut(); } catch (e) { console.error(e); }
  leave(); showAuth('in');
};

/* ===== \u0627\u0644\u062a\u0634\u063a\u064a\u0644 ===== */
let pollT = null;
async function enter(ctx, isNew) {
  if (ctx.role !== 'patient') {
    try { await DB.signOut(); } catch (e) { /* ignore */ }
    throw fail('not_patient', 'nurse account');
  }
  const p = ctx.profile;
  Object.assign(S, { id: ctx.id, name: p.name, birth: p.birth, phone: p.phone, wa: p.wa, createdAt: p.createdAt, barriers: p.barriers || [] });
  await loadAll();
  draft = null; lastSaved = null; talkDraft = '';
  closeDlg(); applyPrefs(); document.body.classList.add('in');
  clearInterval(pollT); pollT = setInterval(poll, 10000);
  if (location.hash !== '#home' && !isNew) route(); else go('home');
  if (isNew) toast('\u0623\u0647\u0644\u064b\u0627 \u0628\u0643 \u0641\u064a Care Line');
}
function leave() {
  clearInterval(pollT); pollT = null;
  Object.assign(S, { id: null, name: '', birth: '', phone: '', wa: '', barriers: [], meds: [], log: {}, bp: [], chat: [] });
  document.body.classList.remove('in');
  VIEWS.forEach(v => { $('#v-' + v).innerHTML = ''; });
}
AUTH_ERR.not_patient = '\u0647\u0630\u0627 \u0627\u0644\u062d\u0633\u0627\u0628 \u0645\u062e\u0635\u0635 \u0644\u0644\u0645\u0645\u0631\u0636\u0629. \u0627\u0633\u062a\u062e\u062f\u0645 \u0644\u0648\u062d\u0629 Care Line - Dashboard.';
async function boot() {
  loadUi(); applyPrefs();
  const done = () => { const sp = $('#splash'); if (sp) sp.remove(); };
  try {
    await DB.init();
    const ctx = await DB.session();
    if (ctx && ctx.role === 'patient') await enter(ctx); else { if (ctx) await DB.signOut(); showAuth('in'); }
    done();
  } catch (e) {
    done();
    console.error(e);
    openDlg(`<h2 id="dlgT">\u062a\u0639\u0630\u0651\u0631 \u0641\u062a\u062d \u0627\u0644\u0645\u0648\u0642\u0639</h2><p style="margin:.6rem 0 1rem">${esc(errText(e))}</p><button class="btn main" id="rt" type="button">\u0625\u0639\u0627\u062f\u0629 \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629</button>`, d => { $('#rt', d).onclick = () => { closeDlg(); boot(); }; });
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
dlg.addEventListener('cancel', e => { if (!S.id) e.preventDefault(); });
window.addEventListener('hashchange', () => { if (S.id) route(); });
$('#btnSize').addEventListener('click', () => { S.scale = S.scale % 3 + 1; saveUi(); applyPrefs(); });
$('#btnSet').addEventListener('click', () => { if (S.id) openProfile(); });
setInterval(() => { if (S.id && cur === 'home' && !dlg.open && !document.hidden) render(); }, 60000);
boot();

})();
</script>
</body>
</html>
