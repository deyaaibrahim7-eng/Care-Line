<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="script" crossorigin href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js">
<title>Care Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: one calm column, big dose ring as the hero, bottom tab bar on phones, top tabs on desktop */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#E8F0ED; --ink:#12231F; --ink-2:#3D524C; --line:#C9D7D2;
  --primary:#0B5C52; --primary-ink:#FFFFFF; --primary-soft:#D5EAE5;
  --warm:#B5381F; --warm-soft:#FBE4DE; --ok:#1B7A3C; --ok-soft:#DDF1E3; --amber:#7A4F00; --amber-soft:#FBEDCB;
  --shadow:0 1px 2px rgba(18,35,31,.08),0 6px 18px rgba(18,35,31,.06);
  --scale:1;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1715; --surface:#14231F; --surface-2:#1B2F2A; --ink:#E9F3F0; --ink-2:#AFC4BD; --line:#2A413B;
    --primary:#5FD0BC; --primary-ink:#06211C; --primary-soft:#1D3E38;
    --warm:#FF9A84; --warm-soft:#3A1F19; --ok:#6FD595; --ok-soft:#17321F; --amber:#F2C463; --amber-soft:#382B0B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1715; --surface:#14231F; --surface-2:#1B2F2A; --ink:#E9F3F0; --ink-2:#AFC4BD; --line:#2A413B;
  --primary:#5FD0BC; --primary-ink:#06211C; --primary-soft:#1D3E38;
  --warm:#FF9A84; --warm-soft:#3A1F19; --ok:#6FD595; --ok-soft:#17321F; --amber:#F2C463; --amber-soft:#382B0B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
}
:root[data-scale="2"]{--scale:1.15}
:root[data-scale="3"]{--scale:1.32}
:root{font-size:calc(100% * var(--scale))}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.125rem;line-height:1.7;direction:rtl;
  padding-block:0 6.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.2rem;font-weight:600}
p{margin:0} small,.muted{color:var(--ink-2)}
.wrap{max-width:46rem;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.4em;height:1.4em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding-block:.6rem}
.brand{display:flex;align-items:center;gap:.65rem;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.35rem;display:block;line-height:1.2}
.brand span{font-size:.85rem;color:var(--ink-2);display:block;line-height:1.3}
.logo{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.tools{display:flex;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:.35rem .9rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem}
.chip:hover{border-color:var(--primary)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:.4rem max(8px,env(safe-area-inset-left,0px)) calc(.4rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));display:flex;justify-content:space-around;gap:.25rem}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:3.6rem;padding:.35rem .2rem;border-radius:14px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.85rem;line-height:1.3}
.nav a svg.i{width:1.7rem;height:1.7rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
@media(min-width:860px){
  body{padding-block:0 3rem}
  .nav{position:static;border:0;background:none;max-width:46rem;margin:1rem auto 0;padding:0;gap:.5rem}
  .nav a{flex-direction:row;justify-content:center;gap:.5rem;font-size:1rem;border:2px solid var(--line);background:var(--surface);min-height:3.25rem}
  .nav a[aria-current="page"]{border-color:var(--primary)}
}

/* views and cards */
main{max-width:46rem;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:1.1rem}
.view{display:none;flex-direction:column;gap:1.1rem} .view.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.2rem;box-shadow:var(--shadow);min-width:0}
.card.tint{background:var(--primary-soft);border-color:transparent}
.card.warn{background:var(--warm-soft);border-color:var(--warm)}
.card h2,.card h3{margin-bottom:.5rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.75rem}
.stack{display:flex;flex-direction:column;gap:.75rem}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .8rem;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--surface-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--warm-soft);color:var(--warm)} .pill.mid{background:var(--amber-soft);color:var(--amber)}
.note{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:.7rem .9rem;font-size:.95rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.6rem;padding:.6rem 1.4rem;border-radius:16px;border:2px solid var(--primary);
  background:var(--surface);color:var(--primary);font-weight:700;font-size:1.1rem;text-decoration:none;line-height:1.3;text-align:center}
.btn:hover{background:var(--primary-soft)} .btn:active{transform:translateY(1px)}
.btn.main{background:var(--primary);color:var(--primary-ink)} .btn.main:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--warm);color:var(--warm)} .btn.danger.main{background:var(--warm);color:var(--surface)}
.btn.big{min-height:4.4rem;font-size:1.3rem;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:2.9rem;padding:.3rem 1rem;font-size:1rem;border-radius:12px}

/* dose ring */
.ring{position:relative;width:min(100%,17rem);aspect-ratio:1;margin-inline:auto}
.ring svg{width:100%;height:100%;display:block}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.1rem}
.ring .mid strong{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.seg{fill:none;stroke-width:20;stroke-linecap:round}
.seg.none{stroke:var(--line)} .seg.taken{stroke:var(--primary)} .seg.missed{stroke:var(--warm)} .seg.due{stroke:var(--amber)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.85rem;color:var(--ink-2)}
.dot{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--ink-2)}
.dot.full{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.dot.part{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.dot.miss{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.day.today span:last-child{color:var(--ink);font-weight:700}
.dot svg.i{width:1.2rem;height:1.2rem;stroke-width:3}

/* med list */
.med{display:flex;gap:.9rem;align-items:flex-start}
.med .ic{width:3rem;height:3rem;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.med h3{margin:0}
.med .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.grow{flex:1;min-width:0}

/* tables */
.scroll{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;min-width:24rem;font-size:.95rem}
table.log th,table.log td{padding:.45rem .3rem;text-align:center;border-bottom:1px solid var(--line)}
table.log th:first-child,table.log td:first-child{text-align:start;font-weight:600}
.mk{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;font-weight:700}
.mk.t{background:var(--primary);color:var(--primary-ink)} .mk.m{background:var(--warm-soft);color:var(--warm)} .mk.p{color:var(--ink-2)}
.mk svg.i{width:1rem;height:1rem;stroke-width:3}

/* forms */
label.f{display:flex;flex-direction:column;gap:.35rem;font-weight:600}
input[type=text],input[type=number],input[type=tel],textarea,select{width:100%;min-height:3.4rem;padding:.55rem .9rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem}
input:focus,textarea:focus,select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:5rem;resize:vertical}
.togs{display:flex;gap:.5rem;flex-wrap:wrap}
.tog{position:relative}
.tog input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tog span{display:inline-flex;align-items:center;min-height:3.2rem;padding:.4rem 1.1rem;border-radius:999px;border:2px solid var(--line);font-weight:600;background:var(--surface)}
.tog input:checked+span{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tog input:focus-visible+span{outline:3px solid var(--primary);outline-offset:3px}

/* BP stepper */
.steppers{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.75rem}
.step{background:var(--surface-2);border-radius:18px;padding:.8rem;text-align:center}
.step .lbl{font-weight:600;font-size:.95rem;display:block}
.step .ctl{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-top:.3rem}
.step .ctl button{width:3.8rem;height:3.8rem;border-radius:50%;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-size:2rem;line-height:1;font-weight:700;display:grid;place-items:center;flex:none}
.step .ctl button:hover{background:var(--primary-soft)}
.step input{text-align:center;font-family:var(--f-display);font-size:2.2rem;font-weight:700;border:0;background:transparent;min-height:3.8rem;padding:0;direction:ltr;min-width:0}
.result{border-radius:18px;padding:1rem}
.result.ok{background:var(--ok-soft)} .result.mid{background:var(--amber-soft)} .result.bad{background:var(--warm-soft)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--f-body);font-size:12px}
details{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:.2rem 1rem}
details+details{margin-top:.5rem}
summary{cursor:pointer;min-height:3.2rem;display:flex;align-items:center;font-weight:700;list-style:none;gap:.5rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-inline-start:auto;font-size:1.5rem;color:var(--primary)}
details[open] summary::after{content:"\2212"}
details .body{padding-bottom:.9rem}
ul.clean{margin:0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:.35rem}

/* chat */
.chat{display:flex;flex-direction:column;gap:.6rem;max-height:26rem;min-height:12rem;overflow-y:auto;padding:.3rem}
.msg{max-width:88%;padding:.7rem 1rem;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.nurse{background:var(--primary-soft);border-start-start-radius:4px;align-self:flex-start}
.msg.me{background:var(--primary);color:var(--primary-ink);border-start-end-radius:4px;align-self:flex-end}
.msg small{display:block;font-size:.8rem;opacity:.8;margin-bottom:.15rem}
.quick{display:flex;gap:.5rem;flex-wrap:wrap}
.quick button{min-height:3rem;padding:.3rem 1rem;border-radius:999px;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:600}
.quick button:hover{background:var(--primary-soft)}
.composer{display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{min-height:3.6rem;flex:1}
.preview{max-width:100%;border-radius:16px;display:block}

/* dialog */
dialog{border:0;border-radius:22px;padding:1.3rem;max-width:min(32rem,calc(100vw - 2rem));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);direction:rtl;max-height:88vh;overflow-y:auto}
dialog::backdrop{background:rgba(5,15,12,.55)}
.toast{position:fixed;inset-inline:1rem;bottom:calc(6.2rem + env(safe-area-inset-bottom,0px));z-index:50;margin-inline:auto;max-width:28rem;background:var(--ink);color:var(--bg);padding:.8rem 1.1rem;border-radius:16px;text-align:center;font-weight:600}
@media(min-width:860px){.toast{bottom:1.5rem}}
.hero-msg{font-family:var(--f-display);font-size:1.25rem;line-height:1.6}
.tl{position:relative;display:flex;flex-direction:column;gap:.9rem;padding-inline-start:1.6rem}
.tl::before{content:"";position:absolute;inset-block:.4rem;inset-inline-start:.45rem;width:3px;background:var(--line);border-radius:3px}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;inset-inline-start:-1.6rem;top:.5rem;width:.95rem;height:.95rem;border-radius:50%;background:var(--primary);border:3px solid var(--bg)}
.empty{text-align:center;padding:1.2rem .5rem;color:var(--ink-2)}
@media(prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,transform .1s}.view.on{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* ---- Care Line additions ---- */
body:not(.in) .nav,body:not(.in) .tools,body:not(.in) main{display:none}
.nav a{position:relative}
.bdg{position:absolute;top:.15rem;inset-inline-start:calc(50% + .6rem);min-width:1.35rem;height:1.35rem;padding:0 .3rem;border-radius:999px;background:var(--warm);color:var(--surface);font-style:normal;font-size:.75rem;font-weight:700;display:grid;place-items:center;line-height:1}
.banner{display:flex;gap:.8rem;align-items:center;text-decoration:none;color:var(--ink);border:2px solid var(--primary)}
.bignum{font-family:var(--f-display);font-size:2rem;font-weight:700;direction:ltr;display:inline-block}
.kicker{display:inline-flex;align-items:center;gap:.4rem;color:var(--primary)}
.teach h2{font-size:1.3rem}
.dot.future{border-style:dashed;background:transparent;color:var(--ink-2);opacity:.8;font-weight:500}
.dot.none{border-color:transparent;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.dot.pend{border-color:var(--primary);background:transparent;color:var(--primary);font-size:.8rem}
.day.today>span:first-child{box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.9rem;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i.dot{width:1.1rem;height:1.1rem;display:inline-block;border-width:2px}
.authhead{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.tabs{display:flex;gap:.4rem;background:var(--surface-2);padding:.3rem;border-radius:16px;margin-bottom:1rem}
.tabs button{flex:1;min-height:3rem;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.fs{border:0;padding:0;margin:0;min-width:0}
.fs legend{font-weight:600;margin-bottom:.35rem;padding:0}
.bsel{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:.5rem}
.bsel select{padding-inline:.5rem}
.chk{display:flex;gap:.7rem;align-items:flex-start;font-size:1rem}
.chk input{width:1.6rem;height:1.6rem;margin-top:.15rem;flex:none;accent-color:var(--primary)}
.idcard{display:flex;gap:.9rem;align-items:center;background:var(--primary-soft);border-radius:18px;padding:.9rem;margin-top:.8rem}
.sep{border:0;border-top:1px solid var(--line);width:100%;margin:.2rem 0}
.msg.call{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.msg .tm{margin:.25rem 0 0;font-size:.75rem}
.msg.call small{flex-basis:100%;margin:0}
[aria-invalid="true"]{border-color:var(--warm)!important}

/* ---- shell fixes: no horizontal overflow, steady header/nav, compact mobile header, splash ---- */
html,body{max-width:100%;overflow-x:clip}
body{padding-left:0;padding-right:0}
body::before{display:none}
.top{margin-inline:0;top:0;padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:100%;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.nav{transform:translateZ(0);contain:layout paint;left:0;right:0}
.nav a{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.8rem}
.nav a span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(min-width:860px){.nav{padding-inline:16px;contain:none}}
@media(max-width:560px){
  .top .wrap{flex-wrap:nowrap;padding-block:.45rem;gap:.5rem}
  .brand{flex:1}.brand b{font-size:1.2rem}.brand span{display:none}.logo{width:2.4rem;height:2.4rem}
  .tools{gap:.35rem;flex:none}.chip{padding:.3rem .7rem;font-size:.85rem;min-height:2.6rem}.chip .i{width:1.2em;height:1.2em}
  .who{display:none}
  dialog{max-height:92dvh;padding:1.1rem}
}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;gap:.9rem;align-items:center;justify-content:center;background:var(--bg);color:var(--ink)}
#splash b{font-family:var(--f-display);font-size:1.5rem}
.sp-logo{width:4rem;height:4rem;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.sp-logo .i{width:2rem;height:2rem}
.sp-bar{width:7rem;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.sp-bar::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:var(--primary);border-radius:4px}
@media(prefers-reduced-motion:no-preference){.sp-bar::after{animation:spb 1.1s ease-in-out infinite}@keyframes spb{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}}
.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem}
.day{min-width:0;font-size:.8rem}
.dot{width:100%;max-width:2.6rem;height:auto;aspect-ratio:1;min-width:0}
.dot.part,.dot.pend{font-size:.72rem}
body{margin:0}
.brand b{white-space:nowrap}
a.brand{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
a.brand:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:12px}
.brand>div:last-child{min-width:0}
.day{gap:.2rem}
.day .dw{color:var(--ink-2);font-size:.82rem;line-height:1.2;white-space:nowrap}
.day .dn{font-size:.78rem;color:var(--ink-2);opacity:.85;line-height:1;font-variant-numeric:tabular-nums}
.day.today .dw,.day.today .dn{color:var(--ink);font-weight:700;opacity:1}
@media(max-width:560px){
  .tools .chip span{display:none}
  .tools .chip{padding:0;width:2.6rem;min-width:2.6rem;justify-content:center}
  .brand{overflow:hidden}
}
</style>

<script>
(function(){
"use strict";
/* ===================== Care Line: shared core (patient app + nurse dashboard) ===================== */
const CFG = window.CARELINE_CONFIG || {};
const LIVE = !!(CFG.supabaseUrl && CFG.supabaseKey);
const SUPA_SRC = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js';

const SLOTS = {
  m: { ar: '\u0627\u0644\u0635\u0628\u0627\u062d', en: 'Morning', time: '08:00' },
  n: { ar: '\u0627\u0644\u0638\u0647\u0631', en: 'Noon', time: '14:00' },
  e: { ar: '\u0627\u0644\u0645\u0633\u0627\u0621', en: 'Evening', time: '20:00' },
  b: { ar: '\u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645', en: 'Bedtime', time: '22:30' }
};
const ORDER = ['m', 'n', 'e', 'b'];
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const minutesOf = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function uuid() {
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0'));
  return `${h.slice(0, 4).join('')}-${h.slice(4, 6).join('')}-${h.slice(6, 8).join('')}-${h.slice(8, 10).join('')}-${h.slice(10).join('')}`;
}
function ageFrom(birth, now = new Date()) {
  if (!birth) return null;
  const [y, m, d] = String(birth).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  let a = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) a--;
  return a;
}
function toEmail(id) {
  const s = String(id || '').trim().toLowerCase();
  return s.includes('@') ? s : s + '@' + (CFG.phoneEmailDomain || 'careline.app');
}
// Patients sign in with their phone number only; the Auth password is derived from it (Supabase requires one).
const patientPw = phone => 'cl-' + String(phone || '').trim() + '-' + (CFG.accessSalt || 'careline');
function fail(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(fail('network', 'script load failed'));
    document.head.appendChild(s);
  });
}

/* ---------- row <-> app object mapping ---------- */
const mapProfile = r => ({ id: r.id, role: r.role, name: r.full_name || '', birth: r.birth_date ? String(r.birth_date).slice(0, 10) : '', phone: r.phone || '', wa: r.whatsapp || '', barriers: r.barriers || [], createdAt: r.created_at });
const mapMed = r => ({ id: r.id, patientId: r.patient_id, name: r.name, dose: r.dose || '', slots: r.slots || [], how: r.how || '', why: r.why || '', left: r.days_left == null ? '' : r.days_left, addedAt: r.added_at, stoppedOn: r.stopped_on ? String(r.stopped_on).slice(0, 10) : null });
const mapBp = r => ({ id: r.id, patientId: r.patient_id, ts: r.measured_at, sys: r.sys, dia: r.dia, pul: r.pulse == null ? '' : r.pulse });
const mapMsg = r => ({ id: r.id, patientId: r.patient_id, r: r.sender, t: r.body, ts: r.created_at, kind: r.kind || 'text', read: !!r.read_at });
function foldLogs(rows) {
  const map = {};
  for (const r of rows) {
    const day = String(r.day).slice(0, 10);
    (map[day] = map[day] || {})[r.slot] = { s: r.status === 'taken' ? 't' : 's', at: r.taken_at, meds: r.meds || [] };
  }
  return map;
}

/* ---------- adherence logic (identical in both apps) ---------- */
const Adh = {
  expectedSlots(meds, day) {
    const set = new Set();
    for (const m of meds) {
      const addedDay = dk(new Date(m.addedAt));
      if (day < addedDay) continue;
      if (m.stoppedOn && day >= m.stoppedOn) continue;
      for (const s of m.slots) {
        if (day === addedDay) {
          const at = new Date(m.addedAt);
          if (minutesOf(SLOTS[s].time) + 120 <= at.getHours() * 60 + at.getMinutes()) continue;
        }
        set.add(s);
      }
    }
    return ORDER.filter(s => set.has(s));
  },
  slotStatus(logs, day, slot, now = new Date()) {
    const e = (logs[day] || {})[slot];
    if (e) return e.s === 't' ? 't' : 's';
    const today = dk(now);
    if (day < today) return 'm';
    if (day > today) return 'p';
    const cur = now.getHours() * 60 + now.getMinutes(), t = minutesOf(SLOTS[slot].time);
    if (cur > t + 120) return 'm';
    return cur >= t - 30 ? 'd' : 'p';
  },
  dayInfo(meds, logs, day, now = new Date()) {
    const today = dk(now), exp = this.expectedSlots(meds, day);
    const st = exp.map(s => this.slotStatus(logs, day, s, now));
    const taken = st.filter(x => x === 't').length, failed = st.filter(x => x === 'm' || x === 's').length;
    let state = 'none';
    if (day > today) state = 'future';
    else if (!exp.length) state = 'none';
    else if (failed > 0) state = 'miss';
    else if (taken === exp.length) state = 'full';
    else if (day === today) state = taken > 0 ? 'progress' : 'pending';
    return { day, exp, st, taken, failed, total: exp.length, counted: taken + failed, state };
  },
  range(meds, logs, fromDay, toDay, now = new Date()) {
    const days = []; let d = new Date(fromDay + 'T12:00:00');
    const end = new Date(toDay + 'T12:00:00');
    while (d <= end) { days.push(this.dayInfo(meds, logs, dk(d), now)); d = addDays(d, 1); }
    const taken = days.reduce((a, x) => a + x.taken, 0), counted = days.reduce((a, x) => a + x.counted, 0);
    return { days, taken, counted, pct: counted ? Math.round(taken / counted * 100) : null };
  },
  lastDays(meds, logs, n, now = new Date()) { return this.range(meds, logs, dk(addDays(now, -(n - 1))), dk(now), now); },
  streak(meds, logs, now = new Date()) {
    let n = 0;
    for (let i = 0; i < 120; i++) {
      const info = this.dayInfo(meds, logs, dk(addDays(now, -i)), now);
      if (i === 0) { if (info.state === 'full') n++; else if (info.state === 'miss') break; continue; }
      if (info.state === 'full') n++; else break;
    }
    return n;
  },
  missedToday(meds, logs, now = new Date()) {
    const info = this.dayInfo(meds, logs, dk(now), now);
    return info.exp.filter((s, i) => info.st[i] === 'm' || info.st[i] === 's');
  }
};


/* ===================== Backend 1: Supabase ===================== */
function mapDbErr(e) {
  const m = String((e && e.message) || e || '').toLowerCase();
  if (m.includes('fetch') || m.includes('network') || m.includes('timeout')) return fail('network', e.message);
  if ((e && e.code === '42501') || m.includes('row-level security') || m.includes('permission denied')) return fail('denied', e.message);
  return fail('db', e && e.message);
}
function mapAuthErr(e) {
  const m = String((e && e.message) || e || '').toLowerCase();
  if (m.includes('invalid login')) return fail('bad_credentials');
  if (m.includes('already registered') || m.includes('already been registered')) return fail('exists');
  if (m.includes('password') && (m.includes('least') || m.includes('weak'))) return fail('weak_password');
  if (m.includes('email') && (m.includes('invalid') || m.includes('not allowed'))) return fail('bad_email', e.message);
  if (m.includes('rate limit') || m.includes('too many')) return fail('rate');
  if (m.includes('fetch') || m.includes('network')) return fail('network', e.message);
  return fail('auth', e && e.message);
}
const chk = ({ data, error }) => { if (error) throw mapDbErr(error); return data; };

const SBX = {
  live: true, c: null,
  async init() {
    await loadScript(SUPA_SRC);
    if (!window.supabase || !window.supabase.createClient) throw fail('network', 'supabase-js missing');
    this.c = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  },
  async _ctx(id) { const r = chk(await this.c.from('profiles').select('*').eq('id', id).single()); return { id, role: r.role, profile: mapProfile(r) }; },
  async session() {
    const { data, error } = await this.c.auth.getSession();
    if (error || !data.session) return null;
    try { return await this._ctx(data.session.user.id); } catch (e) { if (e.code === 'network') throw e; return null; }
  },
  async signUp(p) {
    const { data, error } = await this.c.auth.signUp({ email: toEmail(p.phone), password: p.password, options: { data: { full_name: p.name, birth_date: p.birth, phone: p.phone, whatsapp: p.wa } } });
    if (error) throw mapAuthErr(error);
    if (!data.session) throw fail('confirm_required');
    return this._ctx(data.user.id);
  },
  async signIn(idf, pw) {
    const { data, error } = await this.c.auth.signInWithPassword({ email: toEmail(idf), password: pw });
    if (error) throw mapAuthErr(error);
    return this._ctx(data.user.id);
  },
  async signOut() { await this.c.auth.signOut(); },
  async updateProfile(id, patch) {
    const row = {};
    if ('name' in patch) row.full_name = patch.name;
    if ('birth' in patch) row.birth_date = patch.birth || null;
    if ('phone' in patch) row.phone = patch.phone;
    if ('wa' in patch) row.whatsapp = patch.wa;
    if ('barriers' in patch) row.barriers = patch.barriers;
    const { error } = await this.c.from('profiles').update(row).eq('id', id);
    if (error) throw mapDbErr(error);
  },
  async meds(pid) { return chk(await this.c.from('medications').select('*').eq('patient_id', pid).order('added_at', { ascending: true })).map(mapMed); },
  medRow(pid, m) { return { patient_id: pid, name: m.name, dose: m.dose || '', slots: m.slots, how: m.how || '', why: m.why || '', days_left: m.left === '' || m.left == null ? null : Number(m.left) }; },
  async addMed(pid, m) { const { error } = await this.c.from('medications').insert({ id: m.id, added_at: m.addedAt, ...this.medRow(pid, m) }); if (error) throw mapDbErr(error); },
  async updateMed(pid, m) { const { error } = await this.c.from('medications').update(this.medRow(pid, m)).eq('id', m.id); if (error) throw mapDbErr(error); },
  async stopMed(id, day) { const { error } = await this.c.from('medications').update({ stopped_on: day }).eq('id', id); if (error) throw mapDbErr(error); },
  async logs(pid, fromDay) { return foldLogs(chk(await this.c.from('dose_logs').select('*').eq('patient_id', pid).gte('day', fromDay))); },
  async setLog(pid, day, slot, s, at, meds) {
    const { error } = await this.c.from('dose_logs').upsert({ patient_id: pid, day, slot, status: s === 't' ? 'taken' : 'skipped', taken_at: at, meds }, { onConflict: 'patient_id,day,slot' });
    if (error) throw mapDbErr(error);
  },
  async bpList(pid) { return chk(await this.c.from('bp_readings').select('*').eq('patient_id', pid).order('measured_at', { ascending: false }).limit(200)).map(mapBp); },
  async addBp(pid, r) { const { error } = await this.c.from('bp_readings').insert({ id: r.id, patient_id: pid, measured_at: r.ts, sys: r.sys, dia: r.dia, pulse: r.pul === '' ? null : r.pul }); if (error) throw mapDbErr(error); },
  async delBp(id) { const { error } = await this.c.from('bp_readings').delete().eq('id', id); if (error) throw mapDbErr(error); },
  async messages(pid) { return chk(await this.c.from('messages').select('*').eq('patient_id', pid).order('created_at', { ascending: false }).limit(200)).reverse().map(mapMsg); },
  async send(pid, sender, body, kind = 'text') { return mapMsg(chk(await this.c.from('messages').insert({ patient_id: pid, sender, body, kind }).select().single())); },
  async markRead(pid) { const { error } = await this.c.rpc('mark_thread_read', { p: pid }); if (error) throw mapDbErr(error); },
  async changePassword(pw) { const { error } = await this.c.auth.updateUser({ password: pw }); if (error) throw mapAuthErr(error); },
  async setPassword(pid, pw) { const { error } = await this.c.rpc('nurse_set_password', { p: pid, new_password: pw }); if (error) throw mapDbErr(error); },
  async patients() { return chk(await this.c.from('profiles').select('*').eq('role', 'patient').order('full_name', { ascending: true })).map(mapProfile); },
  async activeMeds() { return chk(await this.c.from('medications').select('*').is('stopped_on', null)).map(mapMed); },
  async logsOn(day) { return chk(await this.c.from('dose_logs').select('*').eq('day', day)).map(r => ({ patientId: r.patient_id, day: String(r.day).slice(0, 10), slot: r.slot, s: r.status === 'taken' ? 't' : 's', at: r.taken_at, meds: r.meds || [] })); },
  async unread() {
    const rows = chk(await this.c.from('messages').select('patient_id').eq('sender', 'patient').is('read_at', null));
    const o = {}; rows.forEach(r => { o[r.patient_id] = (o[r.patient_id] || 0) + 1; }); return o;
  },
  async unreadCalls() {
    const rows = chk(await this.c.from('messages').select('patient_id').eq('sender', 'patient').eq('kind', 'call').is('read_at', null));
    const o = {}; rows.forEach(r => { o[r.patient_id] = (o[r.patient_id] || 0) + 1; }); return o;
  }
};

/* ===================== Backend 2: local demo (no server; one browser only) ===================== */
const MKEY = 'careline-mock-v2';
const MOCK = {
  live: false, s: null,
  async init() {
    try { const r = localStorage.getItem(MKEY); if (r) this.s = JSON.parse(r); } catch (e) { /* storage unavailable */ }
    if (!this.s) { this.s = seedMock(); this.save(); }
  },
  save() { try { localStorage.setItem(MKEY, JSON.stringify(this.s)); } catch (e) { /* in-memory only */ } },
  _ctx(id) { const p = this.s.profiles.find(x => x.id === id); return { id, role: p.role, profile: mapProfile(p) }; },
  async session() { return this.s.session && this.s.users.some(u => u.id === this.s.session) ? this._ctx(this.s.session) : null; },
  async signUp(p) {
    const email = toEmail(p.phone);
    if (this.s.users.some(u => u.email === email)) throw fail('exists');
    const id = uuid();
    this.s.users.push({ id, email, password: p.password });
    this.s.profiles.push({ id, role: 'patient', full_name: p.name, birth_date: p.birth, phone: p.phone, whatsapp: p.wa, barriers: [], created_at: new Date().toISOString() });
    this.s.session = id; this.save(); return this._ctx(id);
  },
  async signIn(idf, pw) {
    const u = this.s.users.find(x => x.email === toEmail(idf) && x.password === pw);
    if (!u) throw fail('bad_credentials');
    this.s.session = u.id; this.save(); return this._ctx(u.id);
  },
  async signOut() { this.s.session = null; this.save(); },
  async updateProfile(id, patch) {
    const p = this.s.profiles.find(x => x.id === id);
    if ('name' in patch) p.full_name = patch.name;
    if ('birth' in patch) p.birth_date = patch.birth || null;
    if ('phone' in patch) p.phone = patch.phone;
    if ('wa' in patch) p.whatsapp = patch.wa;

/* ---------- toast & dialogs ---------- */
let tt;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 3600);
}
const dlg = $('#dlg');
function openDlg(html, mount) {
  dlg.innerHTML = html;
  if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
  $$('[data-close]', dlg).forEach(b => b.addEventListener('click', closeDlg));
  if (mount) mount(dlg);
}
function closeDlg() { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); } }
function confirmDlg(title, msg, ok = '\u0646\u0639\u0645') {
  return new Promise(res => {
    openDlg(`<h2 id="dlgT">${esc(title)}</h2><p style="margin:.6rem 0 1.1rem">${esc(msg)}</p>
      <div class="row"><button class="btn danger main" id="cy" type="button">${esc(ok)}</button><button class="btn" id="cn" type="button">\u0631\u062c\u0648\u0639</button></div>`,
      d => { $('#cy', d).onclick = () => { closeDlg(); res(true); }; $('#cn', d).onclick = () => { closeDlg(); res(false); }; });
    dlg.addEventListener('close', () => res(false), { once: true });
  });
}

/* ---------- blood pressure classification (ACC/AHA categories; crisis wording from AHA) ---------- */
function classify(sys, dia) {
  if (sys < 90 || dia < 60) return { k: 'low', tone: 'mid', t: '\u0627\u0644\u0636\u063a\u0637 \u0645\u0646\u062e\u0641\u0636', a: '\u0627\u062c\u0644\u0633 \u0623\u0648 \u0627\u0633\u062a\u0644\u0642\u0650 \u062d\u062a\u0649 \u062a\u0647\u062f\u0623 \u0627\u0644\u0623\u0639\u0631\u0627\u0636 \u062b\u0645 \u0623\u0639\u062f \u0627\u0644\u0642\u064a\u0627\u0633. \u0625\u0630\u0627 \u0634\u0639\u0631\u062a \u0628\u062f\u0648\u0627\u0631 \u0634\u062f\u064a\u062f \u0623\u0648 \u0625\u063a\u0645\u0627\u0621\u060c \u0623\u0648 \u062a\u0643\u0631\u0631\u062a \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0645\u0646\u062e\u0641\u0636\u0629\u060c \u062a\u0648\u0627\u0635\u0644 \u0645\u0639 \u0627\u0644\u0645\u0645\u0631\u0636\u0629 \u0623\u0648 \u0627\u0644\u0637\u0628\u064a\u0628 \u0642\u0628\u0644 \u0627\u0644\u062c\u0631\u0639\u0629 \u0627\u0644\u062a\u0627\u0644\u064a\u0629.' };
  if (sys >= 180 || dia >= 120) return { k: 'crisis', tone: 'bad', t: '\u0627\u0644\u0636\u063a\u0637 \u0645\u0631\u062a\u0641\u0639 \u062c\u062f\u064b\u0627', a: '\u0627\u0646\u062a\u0638\u0631 \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642 \u062b\u0645 \u0623\u0639\u062f \u0627\u0644\u0642\u064a\u0627\u0633. \u0625\u0630\u0627 \u0628\u0642\u064a\u062a \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0623\u0639\u0644\u0649 \u0645\u0646 180/120 \u0641\u062a\u0648\u0627\u0635\u0644 \u0645\u0639 \u0627\u0644\u0637\u0628\u064a\u0628 \u0641\u0648\u0631\u064b\u0627. \u0648\u0625\u0630\u0627 \u0635\u0627\u062d\u0628\u0647\u0627 \u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u0635\u062f\u0631 \u0623\u0648 \u0636\u064a\u0642 \u0641\u064a \u0627\u0644\u062a\u0646\u0641\u0633 \u0623\u0648 \u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u0638\u0647\u0631 \u0623\u0648 \u062a\u0646\u0645\u064a\u0644 \u0623\u0648 \u0636\u0639\u0641 \u0623\u0648 \u062a\u063a\u064a\u0651\u0631 \u0641\u064a \u0627\u0644\u0631\u0624\u064a\u0629 \u0623\u0648 \u0635\u0639\u0648\u0628\u0629 \u0641\u064a \u0627\u0644\u0643\u0644\u0627\u0645\u060c \u0641\u0627\u062a\u0635\u0644 \u0628\u0627\u0644\u0625\u0633\u0639\u0627\u0641 123 \u0648\u0644\u0627 \u062a\u0646\u062a\u0638\u0631.' };
  if (sys >= 140 || dia >= 90) return { k: 's2', tone: 'bad', t: '\u0627\u0644\u0636\u063a\u0637 \u0645\u0631\u062a\u0641\u0639', a: '\u0627\u0633\u062a\u0645\u0631 \u0639\u0644\u0649 \u0623\u062f\u0648\u064a\u062a\u0643 \u0641\u064a \u0645\u0648\u0627\u0639\u064a\u062f\u0647\u0627\u060c \u0648\u0644\u0627 \u062a\u0648\u0642\u0641 \u0623\u064a \u062f\u0648\u0627\u0621 \u0645\u0646 \u062a\u0644\u0642\u0627\u0621 \u0646\u0641\u0633\u0643. \u0623\u0631\u0633\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0625\u0644\u0649 \u0627\u0644\u0645\u0645\u0631\u0636\u0629 \u0627\u0644\u064a\u0648\u0645 \u0644\u062a\u062a\u0627\u0628\u0639\u0647\u0627 \u0645\u0639\u0643.' };
  if (sys >= 130 || dia >= 80) return { k: 's1', tone: 'mid', t: '\u0623\u0639\u0644\u0649 \u0645\u0646 \u0627\u0644\u0645\u0639\u062f\u0644 \u0642\u0644\u064a\u0644\u064b\u0627', a: '\u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0642\u0631\u064a\u0628\u0629 \u0645\u0646 \u0627\u0644\u0645\u0637\u0644\u0648\u0628. \u0627\u0633\u062a\u0645\u0631 \u0639\u0644\u0649 \u0627\u0644\u062f\u0648\u0627\u0621\u060c \u0648\u0642\u0644\u0651\u0644 \u0627\u0644\u0645\u0644\u062d\u060c \u0648\u0623\u0639\u062f \u0627\u0644\u0642\u064a\u0627\u0633 \u063a\u062f\u064b\u0627 \u0641\u064a \u0627\u0644\u0645\u0648\u0639\u062f \u0646\u0641\u0633\u0647.' };
  if (sys >= 120) return { k: 'el', tone: 'mid', t: '\u0645\u0642\u0628\u0648\u0644\u060c \u0648\u064a\u062d\u062a\u0627\u062c \u0625\u0644\u0649 \u0645\u062a\u0627\u0628\u0639\u0629', a: '\u062c\u064a\u062f. \u062d\u0627\u0641\u0638 \u0639\u0644\u0649 \u0627\u0644\u062f\u0648\u0627\u0621 \u0648\u0627\u0644\u0623\u0643\u0644 \u0642\u0644\u064a\u0644 \u0627\u0644\u0645\u0644\u062d \u0648\u0627\u0644\u0645\u0634\u064a.' };
  return { k: 'ok', tone: 'ok', t: '\u0627\u0644\u0636\u063a\u0637 \u0637\u0628\u064a\u0639\u064a', a: '\u0647\u0630\u0627 \u064a\u0639\u0646\u064a \u0623\u0646 \u0627\u0644\u0639\u0644\u0627\u062c \u064a\u0639\u0645\u0644. \u0627\u0633\u062a\u0645\u0631 \u0639\u0644\u064a\u0647 \u062d\u062a\u0649 \u0644\u0648 \u0643\u0646\u062a \u0628\u062e\u064a\u0631.' };
}

/* ---------- server sync ---------- */
function errText(e) {
  return ({ network: '\u062a\u0639\u0630\u0651\u0631 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0625\u0646\u062a\u0631\u0646\u062a. \u062a\u062d\u0642\u0642 \u0645\u0646 \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0648\u0623\u0639\u062f \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629.', denied: '\u0644\u0627 \u062a\u0645\u0644\u0643 \u0635\u0644\u0627\u062d\u064a\u0629 \u062a\u0646\u0641\u064a\u0630 \u0647\u0630\u0627 \u0627\u0644\u0625\u062c\u0631\u0627\u0621.' })[e && e.code] || ('\u062d\u062f\u062b \u062e\u0637\u0623 \u063a\u064a\u0631 \u0645\u062a\u0648\u0642\u0639. \u0623\u0639\u062f \u0627\u0644\u0645\u062d\u0627\u0648\u0644\u0629.' + (e && e.message ? ' [' + String(e.message).slice(0, 140) + ']' : ''));
}
async function loadAll() {
  const from = dk(addDays(new Date(), -60));
  const [meds, log, bp, chat] = await Promise.all([DB.meds(S.id), DB.logs(S.id, from), DB.bpList(S.id), DB.messages(S.id)]);
  S.meds = meds; S.log = log; S.bp = bp; S.chat = chat;
}
async function sync(fn) {
  try { await fn(); } catch (e) {
    console.error(e); toast(errText(e));
    try { await loadAll(); } catch (e2) { /* keep local view */ }
    render();
  }
}
function record(slot, status) {
  const day = dk(new Date()), at = new Date().toISOString();
  const meds = medsIn(slot).map(m => ({ name: m.name, dose: m.dose }));
  (S.log[day] = S.log[day] || {})[slot] = { s: status, at, meds };
  sync(() => DB.setLog(S.id, day, slot, status, at, meds));
}

/* ---------- week & day views built on the shared adherence logic ---------- */
function weekView(now = new Date()) {
  const start = addDays(now, -((now.getDay() + 1) % 7));   // the week starts on Saturday
  const days = [];
  for (let i = 0; i < 7; i++) {
    const date = addDays(start, i);
    days.push({ ...Adh.dayInfo(S.meds, S.log, dk(date), now), date, dow: DAYS[date.getDay()] });
  }
  const taken = days.reduce((a, d) => a + d.taken, 0), counted = days.reduce((a, d) => a + d.counted, 0);
  return { days, taken, counted, pct: counted ? Math.round(taken / counted * 100) : null };
}

  ['\u0645\u0646 \u0623\u064a\u0646 \u064a\u0623\u062a\u064a \u0627\u0644\u0645\u0644\u062d \u0627\u0644\u062e\u0641\u064a\u061f', '\u0645\u0639\u0638\u0645 \u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645 \u0627\u0644\u0630\u064a \u0646\u062a\u0646\u0627\u0648\u0644\u0647 \u064a\u0623\u062a\u064a \u0645\u0646 \u0627\u0644\u0623\u0637\u0639\u0645\u0629 \u0627\u0644\u0645\u0635\u0646\u0651\u0639\u0629 \u0648\u0623\u0637\u0639\u0645\u0629 \u0627\u0644\u0645\u0637\u0627\u0639\u0645\u060c \u0644\u0627 \u0645\u0646 \u0627\u0644\u0645\u0645\u0644\u062d\u0629 \u0639\u0644\u0649 \u0627\u0644\u0645\u0627\u0626\u062f\u0629. \u0627\u0644\u0645\u062e\u0644\u0644\u0627\u062a \u0648\u0627\u0644\u062c\u0628\u0646 \u0627\u0644\u0645\u0645\u0644\u062d \u0648\u0627\u0644\u0645\u0631\u0642 \u0627\u0644\u062c\u0627\u0647\u0632 \u0648\u0627\u0644\u0645\u0639\u0644\u0628\u0627\u062a \u0645\u0646 \u0623\u0647\u0645 \u0645\u0635\u0627\u062f\u0631\u0647.', 'AHA'],
  ['\u0627\u0642\u0631\u0623 \u0645\u0644\u0635\u0642 \u0627\u0644\u063a\u0630\u0627\u0621', '\u0639\u0644\u0649 \u0645\u0644\u0635\u0642 \u0627\u0644\u0645\u0646\u062a\u062c\u060c \u0627\u0644\u0646\u0633\u0628\u0629 5% \u0623\u0648 \u0623\u0642\u0644 \u0645\u0646 \u0627\u0644\u0642\u064a\u0645\u0629 \u0627\u0644\u064a\u0648\u0645\u064a\u0629 \u0644\u0644\u0635\u0648\u062f\u064a\u0648\u0645 \u062a\u0639\u0646\u064a \u0623\u0646\u0647 \u0645\u0646\u062e\u0641\u0636\u060c \u064820% \u0623\u0648 \u0623\u0643\u062b\u0631 \u062a\u0639\u0646\u064a \u0623\u0646\u0647 \u0645\u0631\u062a\u0641\u0639. \u0627\u062e\u062a\u0631 \u0627\u0644\u0623\u0642\u0644 \u0643\u0644\u0645\u0627 \u0623\u0645\u0643\u0646.', 'FDA'],
  ['\u0627\u0634\u0637\u0641 \u0627\u0644\u0645\u0639\u0644\u0651\u0628\u0627\u062a', '\u063a\u0633\u0644 \u0627\u0644\u0641\u0648\u0644 \u0648\u0627\u0644\u062d\u0645\u0635 \u0648\u0627\u0644\u062e\u0636\u0631\u0648\u0627\u062a \u0627\u0644\u0645\u0639\u0644\u0651\u0628\u0629 \u0628\u0627\u0644\u0645\u0627\u0621 \u0642\u0628\u0644 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647\u0627 \u064a\u062e\u0641\u0636 \u062c\u0632\u0621\u064b\u0627 \u0645\u0646 \u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645 \u0627\u0644\u0630\u064a \u0641\u064a\u0647\u0627.', 'AHA'],
  ['\u0642\u064a\u0627\u0633 \u0627\u0644\u0636\u063a\u0637 \u0641\u064a \u0627\u0644\u0645\u0646\u0632\u0644: \u0627\u0644\u062a\u062d\u0636\u064a\u0631', '\u0627\u062c\u0644\u0633 \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642 \u0642\u0628\u0644 \u0627\u0644\u0642\u064a\u0627\u0633\u060c \u0648\u0638\u0647\u0631\u0643 \u0645\u0633\u0646\u0648\u062f \u0648\u0642\u062f\u0645\u0627\u0643 \u0639\u0644\u0649 \u0627\u0644\u0623\u0631\u0636\u060c \u0648\u0630\u0631\u0627\u0639\u0643 \u0645\u0631\u062a\u0627\u062d\u0629 \u0639\u0644\u0649 \u0645\u0633\u062a\u0648\u0649 \u0627\u0644\u0642\u0644\u0628. \u062a\u062c\u0646\u0651\u0628 \u0627\u0644\u0642\u0647\u0648\u0629 \u0648\u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0648\u0627\u0644\u0631\u064a\u0627\u0636\u0629 \u0642\u0628\u0644 \u0627\u0644\u0642\u064a\u0627\u0633 \u0628\u062b\u0644\u0627\u062b\u064a\u0646 \u062f\u0642\u064a\u0642\u0629.', 'AHA'],
  ['\u0642\u064a\u0627\u0633 \u0627\u0644\u0636\u063a\u0637 \u0641\u064a \u0627\u0644\u0645\u0646\u0632\u0644: \u0627\u0644\u062a\u0643\u0631\u0627\u0631', '\u062e\u0630 \u0642\u0631\u0627\u0621\u062a\u064a\u0646 \u0628\u064a\u0646\u0647\u0645\u0627 \u062f\u0642\u064a\u0642\u0629\u060c \u0645\u0631\u0629 \u0641\u064a \u0627\u0644\u0635\u0628\u0627\u062d \u0648\u0645\u0631\u0629 \u0641\u064a \u0627\u0644\u0645\u0633\u0627\u0621\u060c \u0642\u0628\u0644 \u0627\u0644\u062f\u0648\u0627\u0621 \u0625\u0646 \u0623\u0645\u0643\u0646. \u0633\u062c\u0651\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u0627\u062a \u0644\u064a\u0631\u0627\u062c\u0639\u0647\u0627 \u0627\u0644\u0637\u0628\u064a\u0628.', 'AHA'],
  ['\u0636\u0639 \u0627\u0644\u0634\u0631\u064a\u0637 \u0639\u0644\u0649 \u0630\u0631\u0627\u0639 \u0639\u0627\u0631\u064a\u0629', '\u0627\u0644\u0634\u0631\u064a\u0637 \u0641\u0648\u0642 \u0627\u0644\u0645\u0644\u0627\u0628\u0633 \u064a\u0639\u0637\u064a \u0642\u0631\u0627\u0621\u0629 \u063a\u064a\u0631 \u062f\u0642\u064a\u0642\u0629. \u0627\u0631\u0641\u0639 \u0627\u0644\u0643\u0645 \u0623\u0648 \u0627\u062e\u0644\u0639 \u0627\u0644\u062b\u0648\u0628\u060c \u0648\u0644\u0627 \u062a\u062a\u062d\u062f\u062b \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0642\u064a\u0627\u0633.', 'AHA'],
  ['\u0645\u0627 \u0647\u0648 \u0627\u0644\u0636\u063a\u0637 \u0627\u0644\u0645\u0633\u062a\u0647\u062f\u0641\u061f', '\u064a\u064f\u0633\u062a\u0647\u062f\u0641 \u0644\u062f\u0649 \u0623\u063a\u0644\u0628 \u0627\u0644\u0628\u0627\u0644\u063a\u064a\u0646 \u0623\u0646 \u064a\u0643\u0648\u0646 \u0627\u0644\u0636\u063a\u0637 \u0623\u0642\u0644 \u0645\u0646 130/80 \u0648\u0641\u0642 \u0625\u0631\u0634\u0627\u062f\u0627\u062a ACC/AHA. \u0627\u0644\u0637\u0628\u064a\u0628 \u0647\u0648 \u0645\u0646 \u064a\u062d\u062f\u062f \u0647\u062f\u0641\u0643 \u0628\u062d\u0633\u0628 \u062d\u0627\u0644\u062a\u0643.', 'AHA'],
  ['\u0623\u0631\u0642\u0627\u0645 \u0627\u0644\u0636\u063a\u0637', '\u0627\u0644\u0631\u0642\u0645 \u0627\u0644\u0623\u0643\u0628\u0631 \u0647\u0648 \u0636\u063a\u0637 \u0627\u0644\u062f\u0645 \u0623\u062b\u0646\u0627\u0621 \u0627\u0646\u0642\u0628\u0627\u0636 \u0627\u0644\u0642\u0644\u0628\u060c \u0648\u0627\u0644\u0631\u0642\u0645 \u0627\u0644\u0623\u0635\u063a\u0631 \u0647\u0648 \u0636\u063a\u0637\u0647 \u0623\u062b\u0646\u0627\u0621 \u0627\u0633\u062a\u0631\u062e\u0627\u0626\u0647 \u0628\u064a\u0646 \u0627\u0644\u0646\u0628\u0636\u0627\u062a. \u0643\u0644\u0627\u0647\u0645\u0627 \u0645\u0647\u0645.', 'AHA'],
  ['\u0646\u0638\u0627\u0645 DASH \u0627\u0644\u063a\u0630\u0627\u0626\u064a', '\u064a\u0639\u062a\u0645\u062f \u0639\u0644\u0649 \u0627\u0644\u062e\u0636\u0631\u0648\u0627\u062a \u0648\u0627\u0644\u0641\u0627\u0643\u0647\u0629 \u0648\u0627\u0644\u062d\u0628\u0648\u0628 \u0627\u0644\u0643\u0627\u0645\u0644\u0629 \u0648\u0645\u0646\u062a\u062c\u0627\u062a \u0627\u0644\u0623\u0644\u0628\u0627\u0646 \u0642\u0644\u064a\u0644\u0629 \u0627\u0644\u062f\u0633\u0645\u060c \u0648\u064a\u0642\u0644\u0651\u0644 \u0627\u0644\u062f\u0647\u0648\u0646 \u0627\u0644\u0645\u0634\u0628\u0639\u0629 \u0648\u0627\u0644\u0633\u0643\u0631\u064a\u0627\u062a. \u0623\u062b\u0628\u062a\u062a \u0627\u0644\u062f\u0631\u0627\u0633\u0627\u062a \u0623\u0646\u0647 \u064a\u062e\u0641\u0636 \u0627\u0644\u0636\u063a\u0637.', 'NHLBI'],
  ['\u0627\u0644\u0628\u0648\u062a\u0627\u0633\u064a\u0648\u0645 \u064a\u0648\u0627\u0632\u0646 \u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645', '\u0627\u0644\u0623\u063a\u0630\u064a\u0629 \u0627\u0644\u063a\u0646\u064a\u0629 \u0628\u0627\u0644\u0628\u0648\u062a\u0627\u0633\u064a\u0648\u0645\u060c \u0643\u0627\u0644\u0645\u0648\u0632 \u0648\u0627\u0644\u0628\u0637\u0627\u0637\u0627 \u0648\u0627\u0644\u0639\u062f\u0633 \u0648\u0627\u0644\u0633\u0628\u0627\u0646\u062e\u060c \u062a\u0633\u0627\u0639\u062f \u0627\u0644\u062c\u0633\u0645 \u0639\u0644\u0649 \u0627\u0644\u062a\u062e\u0644\u0635 \u0645\u0646 \u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645. \u0627\u0633\u0623\u0644 \u0637\u0628\u064a\u0628\u0643 \u0623\u0648\u0644\u064b\u0627 \u0625\u0646 \u0643\u0627\u0646 \u0644\u062f\u064a\u0643 \u0645\u0631\u0636 \u0641\u064a \u0627\u0644\u0643\u0644\u0649 \u0623\u0648 \u062a\u062a\u0646\u0627\u0648\u0644 \u0623\u062f\u0648\u064a\u0629 \u0645\u0639\u064a\u0651\u0646\u0629 \u0644\u0644\u0636\u063a\u0637.', 'AHA'],
  ['\u0628\u062f\u0627\u0626\u0644 \u0627\u0644\u0645\u0644\u062d', '\u0643\u062b\u064a\u0631 \u0645\u0646 \u0628\u062f\u0627\u0626\u0644 \u0627\u0644\u0645\u0644\u062d \u062a\u062d\u062a\u0648\u064a \u0639\u0644\u0649 \u0627\u0644\u0628\u0648\u062a\u0627\u0633\u064a\u0648\u0645\u060c \u0648\u0642\u062f \u0644\u0627 \u062a\u0646\u0627\u0633\u0628 \u0645\u0631\u0636\u0649 \u0627\u0644\u0643\u0644\u0649 \u0623\u0648 \u0645\u0646 \u064a\u062a\u0646\u0627\u0648\u0644\u0648\u0646 \u0628\u0639\u0636 \u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u0636\u063a\u0637. \u0627\u0633\u062a\u0634\u0631 \u0627\u0644\u0637\u0628\u064a\u0628 \u0642\u0628\u0644 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647\u0627.', 'AHA'],
  ['\u0627\u0644\u0645\u0634\u064a \u064a\u062e\u0641\u0636 \u0627\u0644\u0636\u063a\u0637', '\u064a\u0648\u0635\u0649 \u0628\u0646\u062d\u0648 150 \u062f\u0642\u064a\u0642\u0629 \u0623\u0633\u0628\u0648\u0639\u064a\u064b\u0627 \u0645\u0646 \u0627\u0644\u0646\u0634\u0627\u0637 \u0627\u0644\u0628\u062f\u0646\u064a \u0627\u0644\u0645\u0639\u062a\u062f\u0644\u060c \u0645\u062b\u0644 \u0627\u0644\u0645\u0634\u064a \u0627\u0644\u0633\u0631\u064a\u0639\u060c \u0623\u064a \u062d\u0648\u0627\u0644\u064a 30 \u062f\u0642\u064a\u0642\u0629 \u0641\u064a \u0623\u063a\u0644\u0628 \u0623\u064a\u0627\u0645 \u0627\u0644\u0623\u0633\u0628\u0648\u0639.', 'WHO'],
  ['\u0627\u0644\u0648\u0632\u0646 \u0648\u0627\u0644\u0636\u063a\u0637', '\u0643\u0644 \u0643\u064a\u0644\u0648\u062c\u0631\u0627\u0645 \u064a\u064f\u0641\u0642\u062f \u0645\u0646 \u0627\u0644\u0648\u0632\u0646 \u0627\u0644\u0632\u0627\u0626\u062f \u064a\u062e\u0641\u0636 \u0627\u0644\u0636\u063a\u0637 \u0628\u0646\u062d\u0648 1 \u0645\u0644\u0645 \u0632\u0626\u0628\u0642 \u062a\u0642\u0631\u064a\u0628\u064b\u0627. \u062d\u062a\u0649 \u0627\u0644\u0646\u0642\u0635 \u0627\u0644\u0642\u0644\u064a\u0644 \u0641\u064a \u0627\u0644\u0648\u0632\u0646 \u0645\u0641\u064a\u062f.', 'AHA'],
  ['\u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0648\u0627\u0644\u0634\u064a\u0634\u0629', '\u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u064a\u0631\u0641\u0639 \u0627\u0644\u0636\u063a\u0637 \u0645\u0624\u0642\u062a\u064b\u0627 \u0648\u064a\u062a\u0644\u0641 \u062c\u062f\u0631\u0627\u0646 \u0627\u0644\u0634\u0631\u0627\u064a\u064a\u0646 \u0639\u0644\u0649 \u0627\u0644\u0645\u062f\u0649 \u0627\u0644\u0628\u0639\u064a\u062f\u060c \u0648\u0627\u0644\u0634\u064a\u0634\u0629 \u0644\u064a\u0633\u062a \u0623\u0642\u0644 \u0636\u0631\u0631\u064b\u0627. \u0627\u0644\u0625\u0642\u0644\u0627\u0639 \u0645\u0646 \u0623\u0641\u0636\u0644 \u0645\u0627 \u062a\u0641\u0639\u0644\u0647 \u0644\u0642\u0644\u0628\u0643\u060c \u0648\u064a\u0645\u0643\u0646 \u0644\u0644\u0637\u0628\u064a\u0628 \u0623\u0646 \u064a\u0633\u0627\u0639\u062f\u0643.', 'WHO'],
  ['\u0627\u0644\u0646\u0648\u0645 \u0627\u0644\u0643\u0627\u0641\u064a', '\u064a\u062d\u062a\u0627\u062c \u0627\u0644\u0628\u0627\u0644\u063a\u0648\u0646 \u0639\u0627\u062f\u0629\u064b \u0645\u0646 7 \u0625\u0644\u0649 9 \u0633\u0627\u0639\u0627\u062a \u0646\u0648\u0645 \u064a\u0648\u0645\u064a\u064b\u0627. \u0642\u0644\u0629 \u0627\u0644\u0646\u0648\u0645 \u0627\u0644\u0645\u0632\u0645\u0646\u0629 \u062a\u0631\u062a\u0628\u0637 \u0628\u0627\u0631\u062a\u0641\u0627\u0639 \u0627\u0644\u0636\u063a\u0637.', 'AHA'],
  ['\u0627\u0644\u0636\u063a\u0637 \u0627\u0644\u0646\u0641\u0633\u064a', '\u0627\u0644\u062a\u0648\u062a\u0631 \u0627\u0644\u0645\u0633\u062a\u0645\u0631 \u064a\u0631\u0647\u0642 \u0627\u0644\u0642\u0644\u0628. \u062c\u0631\u0651\u0628 \u0627\u0644\u062a\u0646\u0641\u0633 \u0627\u0644\u0639\u0645\u064a\u0642 \u0627\u0644\u0628\u0637\u064a\u0621\u060c \u0648\u0627\u0644\u0645\u0634\u064a\u060c \u0648\u0627\u0644\u062d\u062f\u064a\u062b \u0645\u0639 \u0634\u062e\u0635 \u062a\u062b\u0642 \u0628\u0647. \u0648\u0647\u0630\u0647 \u062a\u062f\u0639\u0645 \u0627\u0644\u0639\u0644\u0627\u062c \u0648\u0644\u0627 \u062a\u063a\u0646\u064a \u0639\u0646\u0647.', 'Mayo Clinic'],
  ['\u0645\u0633\u0643\u0646\u0627\u062a \u0627\u0644\u0623\u0644\u0645 \u0642\u062f \u062a\u0631\u0641\u0639 \u0627\u0644\u0636\u063a\u0637', '\u0628\u0639\u0636 \u0645\u0633\u0643\u0646\u0627\u062a \u0627\u0644\u0623\u0644\u0645\u060c \u0645\u062b\u0644 \u0627\u0644\u0625\u064a\u0628\u0648\u0628\u0631\u0648\u0641\u064a\u0646 \u0648\u0627\u0644\u062f\u064a\u0643\u0644\u0648\u0641\u064a\u0646\u0627\u0643\u060c \u0642\u062f \u062a\u0631\u0641\u0639 \u0627\u0644\u0636\u063a\u0637 \u0623\u0648 \u062a\u0636\u0639\u0641 \u062a\u0623\u062b\u064a\u0631 \u062f\u0648\u0627\u0626\u0647. \u0627\u0633\u0623\u0644 \u0627\u0644\u0635\u064a\u062f\u0644\u064a \u0642\u0628\u0644 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647\u0627.', 'Mayo Clinic'],

function dayOfYear(d = new Date()) { return Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 0)) / 864e5); }
function teachToday(d = new Date()) {
  // \u0627\u0644\u062f\u0648\u0631\u0629 \u062a\u062a\u062d\u0631\u0643 \u064a\u0648\u0645\u064a\u064b\u0627\u061b \u0648\u0628\u0625\u0636\u0627\u0641\u0629 \u0627\u0644\u0633\u0646\u0629 \u0646\u062a\u062c\u0646\u0628 \u062a\u0643\u0631\u0627\u0631 \u0627\u0644\u062a\u0631\u062a\u064a\u0628 \u0646\u0641\u0633\u0647 \u0639\u0627\u0645\u064b\u0627 \u0628\u0639\u062f \u0639\u0627\u0645
  return TEACH[(dayOfYear(d) + d.getFullYear() * 7) % TEACH.length];
}

const ACT = {}, RENDER = {};
let cur = 'home';
const VIEWS = ['home', 'meds', 'bp', 'talk', 'care'];
function render() { if (!S.id) return; try { RENDER[cur] && RENDER[cur](); } catch (e) { console.error(e); } paintBadge(); }
function go(v) { if (location.hash !== '#' + v) location.hash = v; else route(); }
function route() {
  const h = (location.hash || '').replace('#', '');
  cur = VIEWS.includes(h) ? h : 'home';
  VIEWS.forEach(v => $('#v-' + v).classList.toggle('on', v === cur));
  $$('#nav a').forEach(a => { if (a.dataset.v === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  render(); window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const br = e.target.closest('#brand');
  if (br) { e.preventDefault(); if (cur === 'home') { route(); } else go('home'); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f) f(b, e);
});
const unreadCount = () => S.chat.filter(m => m.r === 'nurse' && !m.read).length;
function paintBadge() {
  const n = unreadCount(), a = $('#nav a[data-v="talk"]');
  if (!a) return;
  let b = $('.bdg', a);
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('em'); b.className = 'bdg'; a.appendChild(b); }
  b.textContent = n > 9 ? '+9' : String(n);
  b.setAttribute('aria-label', n + ' \u0631\u0633\u0627\u0626\u0644 \u062c\u062f\u064a\u062f\u0629');
}

function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function ringSvg(items) {
  const n = items.length, cls = { t: 'taken', m: 'missed', s: 'missed', d: 'due', p: 'none' };
  let body = '';
  if (n === 0) body = `<circle class="seg none" cx="100" cy="100" r="82"/>`;
  else if (n === 1) body = `<circle class="seg ${cls[items[0].st]}" cx="100" cy="100" r="82"/>`;
  else {
    const span = 360 / n, gap = 14;
    items.forEach((it, i) => { body += `<path class="seg ${cls[it.st]}" d="${arc(100, 100, 82, -90 + i * span + gap / 2, -90 + (i + 1) * span - gap / 2)}"/>`; });
  }
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${body}</svg>`;
}
function weekDot(d, todayKey) {
  const lbl = `${d.dow} ${d.date.getDate()}`;
  const mk = (cls, inner, say) => `<div class="day ${d.day === todayKey ? 'today' : ''}" role="img" aria-label="${lbl}: ${say}"><span class="dot ${cls}">${inner}</span><span class="dw">${d.dow}</span><span class="dn">${d.date.getDate()}</span></div>`;
  switch (d.state) {
    case 'full': return mk('full', ico('check'), '\u062a\u0646\u0627\u0648\u0644\u062a \u0643\u0644 \u0627\u0644\u062c\u0631\u0639\u0627\u062a');
    case 'miss': return mk('miss', ico('x'), d.taken ? `\u062a\u0646\u0627\u0648\u0644\u062a ${d.taken} \u0645\u0646 ${d.total}` : '\u0644\u0645 \u062a\u062a\u0646\u0627\u0648\u0644 \u0627\u0644\u062c\u0631\u0639\u0627\u062a');
    case 'progress': return mk('part', `${d.taken}/${d.total}`, `\u062a\u0646\u0627\u0648\u0644\u062a ${d.taken} \u0645\u0646 ${d.total} \u062d\u062a\u0649 \u0627\u0644\u0622\u0646`);
    case 'pending': return mk('pend', `${d.taken}/${d.total}`, '\u0644\u0645 \u062a\u0628\u062f\u0623 \u062c\u0631\u0639\u0627\u062a \u0627\u0644\u064a\u0648\u0645 \u0628\u0639\u062f');
    case 'future': return mk('future', '', '\u064a\u0648\u0645 \u0642\u0627\u062f\u0645');

      <fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:.35rem">\u0645\u062a\u0649 \u062a\u062a\u0646\u0627\u0648\u0644\u0647\u061f (\u064a\u0645\u0643\u0646 \u0627\u062e\u062a\u064a\u0627\u0631 \u0623\u0643\u062b\u0631 \u0645\u0646 \u0648\u0642\u062a)</legend>
        <div class="togs">${ORDER.map(s => `<label class="tog"><input type="checkbox" name="sl" value="${s}" ${m.slots.includes(s) ? 'checked' : ''}><span>${SLOTS[s].name}</span></label>`).join('')}</div></fieldset>
      <label class="f">\u0637\u0631\u064a\u0642\u0629 \u0627\u0644\u062a\u0646\u0627\u0648\u0644<select id="mh">${hows.map(h => `<option value="${h}" ${h === m.how ? 'selected' : ''}>${h || '\u0623\u064a \u0648\u0642\u062a'}</option>`).join('')}</select></label>
      <label class="f">\u0633\u0628\u0628 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)<input type="text" id="mw" value="${esc(m.why)}" placeholder="\u0645\u062b\u0627\u0644: \u0644\u062e\u0641\u0636 \u0627\u0644\u0636\u063a\u0637"></label>
      <label class="f">\u0643\u0645 \u064a\u0648\u0645\u064b\u0627 \u062a\u0643\u0641\u064a \u0627\u0644\u0639\u0644\u0628\u0629\u061f (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)<input type="number" id="ml" inputmode="numeric" min="0" max="999" value="${esc(m.left)}"></label>
      <p id="me" class="note" role="alert" hidden></p>
      <div class="row"><button class="btn main" id="msv" type="submit">\u062d\u0641\u0638</button><button class="btn" type="button" data-close>\u0625\u0644\u063a\u0627\u0621</button></div>
    </form>`, d => {
    $('#mf', d).addEventListener('submit', async e => {
      e.preventDefault();
      const name = $('#mn', d).value.trim(), sl = $$('input[name=sl]:checked', d).map(x => x.value), er = $('#me', d);
      if (!name || !sl.length) { er.hidden = false; er.textContent = !name ? '\u0627\u0643\u062a\u0628 \u0627\u0633\u0645 \u0627\u0644\u062f\u0648\u0627\u0621.' : '\u0627\u062e\u062a\u0631 \u0648\u0642\u062a\u064b\u0627 \u0648\u0627\u062d\u062f\u064b\u0627 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644.'; return; }
      const left = $('#ml', d).value;
      const rec = { id: m.id || uuid(), name, dose: $('#md', d).value.trim(), slots: ORDER.filter(s => sl.includes(s)), how: $('#mh', d).value, why: $('#mw', d).value.trim(), left: left === '' ? '' : Math.min(999, Math.max(0, +left)) };
      const btn = $('#msv', d); btn.disabled = true;
      try {
        if (m.id) { await DB.updateMed(S.id, rec); S.meds = S.meds.map(x => x.id === m.id ? { ...x, ...rec } : x); }
        else { const full = { ...rec, patientId: S.id, addedAt: new Date().toISOString(), stoppedOn: null }; await DB.addMed(S.id, full); S.meds.push(full); }
        closeDlg(); render();
        const lost = m.id ? [] : rec.slots.filter(x => !Adh.expectedSlots([{ slots: rec.slots, addedAt: new Date().toISOString(), stoppedOn: null }], dk(new Date())).includes(x));
        toast(lost.length ? `\u062a\u0645 \u0627\u0644\u062d\u0641\u0638. \u0645\u0648\u0639\u062f ${lost.map(z => SLOTS[z].name).join(' \u0648')} \u0645\u0631\u0651 \u0627\u0644\u064a\u0648\u0645\u060c \u0641\u064a\u0628\u062f\u0623 \u0645\u0646 \u0627\u0644\u063a\u062f.` : '\u062a\u0645 \u0627\u0644\u062d\u0641\u0638');
      } catch (ex) { console.error(ex); btn.disabled = false; er.hidden = false; er.textContent = errText(ex); }
    });
  });
}
ACT.addMed = () => medForm();
ACT.editMed = b => { const m = S.meds.find(x => x.id === b.dataset.id); if (m) medForm(m); };
ACT.delMed = async b => {
  const m = S.meds.find(x => x.id === b.dataset.id); if (!m) return;
  if (!await confirmDlg('\u0625\u064a\u0642\u0627\u0641 ' + m.name + '\u061f', '\u0633\u064a\u064f\u0632\u0627\u0644 \u0645\u0646 \u0642\u0627\u0626\u0645\u0629 \u0623\u062f\u0648\u064a\u062a\u0643 \u0648\u062c\u0631\u0639\u0627\u062a \u0627\u0644\u064a\u0648\u0645\u060c \u0648\u062a\u0628\u0642\u0649 \u062c\u0631\u0639\u0627\u062a\u0643 \u0627\u0644\u0633\u0627\u0628\u0642\u0629 \u0645\u062d\u0641\u0648\u0638\u0629. \u0644\u0627 \u062a\u0648\u0642\u0641 \u0623\u064a \u062f\u0648\u0627\u0621 \u0625\u0644\u0627 \u0628\u062a\u0648\u062c\u064a\u0647 \u0627\u0644\u0637\u0628\u064a\u0628.', '\u0625\u064a\u0642\u0627\u0641')) return;
  const day = dk(new Date()); m.stoppedOn = day; render();
  sync(() => DB.stopMed(m.id, day));
};
ACT.refill = async b => {
  const m = S.meds.find(x => x.id === b.dataset.id); if (!m) return;
  const text = `\u0623\u062d\u062a\u0627\u062c \u0625\u0644\u0649 \u0625\u0639\u0627\u062f\u0629 \u0635\u0631\u0641 ${m.name} ${m.dose}. \u064a\u0646\u062a\u0647\u064a \u0627\u0644\u062f\u0648\u0627\u0621 \u0628\u0639\u062f ${m.left} \u0623\u064a\u0627\u0645.`;
  try { S.chat.push(await DB.send(S.id, 'patient', text)); toast('\u0623\u064f\u0631\u0633\u0644 \u0637\u0644\u0628\u0643 \u0625\u0644\u0649 \u0627\u0644\u0645\u0645\u0631\u0636\u0629'); }
  catch (e) { console.error(e); toast(errText(e)); }
};

/* ===== \u0627\u0644\u0636\u063a\u0637 ===== */
let draft = null, lastSaved = null;
const LIM = { sys: [60, 260], dia: [30, 160], pul: [30, 200] };
function initDraft() {
  if (draft) return;
  const l = bpSorted().slice(-1)[0];
  draft = { sys: l ? l.sys : 120, dia: l ? l.dia : 80, pul: l ? l.pul || 72 : 72 };
}
function chartSvg(list) {
  const pts = list.slice(-14);
  if (pts.length < 2) return '<p class="muted">\u0633\u062c\u0651\u0644 \u0642\u0631\u0627\u0621\u062a\u064a\u0646 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644 \u0644\u064a\u0638\u0647\u0631 \u0627\u0644\u0631\u0633\u0645 \u0627\u0644\u0628\u064a\u0627\u0646\u064a.</p>';
  const W = 560, H = 240, L = 40, R = 14, T = 16, B = 34;
  const all = pts.flatMap(p => [p.sys, p.dia]).concat([130, 80]);
  const lo = Math.floor((Math.min(...all) - 6) / 10) * 10, hi = Math.ceil((Math.max(...all) + 6) / 10) * 10;
  const x = i => R + (W - L - R) * (1 - i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = k => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p[k]).toFixed(1)}`).join('');
  let grid = '';
  for (let v = lo; v <= hi; v += 20) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const lastI = pts.length - 1;
  const ticks = pts.map((p, i) => (i === 0 || i === lastI || i % 3 === 0) ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${fmtShort(p.ts)}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="\u0631\u0633\u0645 \u0628\u064a\u0627\u0646\u064a \u0644\u0622\u062e\u0631 ${pts.length} \u0642\u0631\u0627\u0621\u0627\u062a \u0636\u063a\u0637">${grid}
    <line x1="${L}" x2="${W - R}" y1="${y(130)}" y2="${y(130)}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="${L}" x2="${W - R}" y1="${y(80)}" y2="${y(80)}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="${line('sys')}" fill="none" stroke="var(--warm)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${line('dia')}" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.sys)}" r="${i === 0 ? 6 : 3.5}" fill="var(--warm)"/><circle cx="${x(i)}" cy="${y(p.dia)}" r="${i === 0 ? 6 : 3.5}" fill="var(--ink)"/>`).join('')}
    <text x="${x(0) - 10}" y="${y(pts[0].sys) - 10}" text-anchor="end" style="fill:var(--warm);font-weight:700;font-size:14px">${pts[0].sys}</text>
    <text x="${x(0) - 10}" y="${y(pts[0].dia) + 20}" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:14px">${pts[0].dia}</text>
    ${ticks}</svg>
    <div class="row" style="margin-top:.4rem;font-size:.95rem"><span><b style="color:var(--warm)">\u2501</b> \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0639\u0644\u064a\u0627</span><span><b>\u2501</b> \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u062f\u0646\u064a\u0627</span><span class="muted">\u0627\u0644\u062e\u0637 \u0627\u0644\u0645\u062a\u0642\u0637\u0639: \u0627\u0644\u0647\u062f\u0641 130/80</span></div>`;
}
function resultCard(r) {
  const c = classify(r.sys, r.dia);
  return `<div class="result ${c.tone}" role="status"><div class="row sp"><b style="font-size:1.25rem">${c.t}</b>
    <span class="bignum" style="font-size:1.6rem">${r.sys}/${r.dia}</span></div>
    <p style="margin-top:.4rem">${esc(c.a)}</p>
    <div class="row" style="margin-top:.7rem">${c.k === 'crisis' ? `<a class="btn danger main" href="tel:123">${ico('phone')} \u0627\u062a\u0635\u0644 \u0628\u0627\u0644\u0625\u0633\u0639\u0627\u0641 123</a>` : ''}
    <a class="btn" href="#talk">${ico('chat')} \u0631\u0627\u0633\u0644 \u0627\u0644\u0645\u0645\u0631\u0636\u0629</a></div></div>`;
}
RENDER.bp = () => {
  initDraft();
  const el = $('#v-bp'), list = bpSorted(), recent = [...list].reverse().slice(0, 8);
  const stepper = (k, label, hint) => `<div class="step"><span class="lbl" id="lb-${k}">${label}</span><small class="muted">${hint}</small>
    <div class="ctl"><button type="button" data-act="bpStep" data-k="${k}" data-d="1" aria-label="\u0632\u064a\u0627\u062f\u0629 ${label}">+</button>
    <input type="number" inputmode="numeric" id="bp-${k}" data-k="${k}" aria-labelledby="lb-${k}" value="${draft[k]}" min="${LIM[k][0]}" max="${LIM[k][1]}">
    <button type="button" data-act="bpStep" data-k="${k}" data-d="-1" aria-label="\u062a\u0642\u0644\u064a\u0644 ${label}">\u2212</button></div></div>`;
  el.innerHTML = `
    <div class="card"><h1>\u0642\u064a\u0627\u0633 \u0627\u0644\u0636\u063a\u0637</h1><p class="muted">\u0627\u062c\u0644\u0633 \u0645\u0631\u062a\u0627\u062d\u064b\u0627 \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642\u060c \u062b\u0645 \u0642\u0650\u0633 \u0627\u0644\u0636\u063a\u0637 \u0648\u0633\u062c\u0651\u0644 \u0627\u0644\u0623\u0631\u0642\u0627\u0645 \u0643\u0645\u0627 \u062a\u0638\u0647\u0631 \u0639\u0644\u0649 \u0627\u0644\u062c\u0647\u0627\u0632.</p>
      <div class="steppers" style="margin-top:.9rem">${stepper('sys', '\u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0639\u0644\u064a\u0627', '\u0627\u0644\u0631\u0642\u0645 \u0627\u0644\u0623\u0643\u0628\u0631')}${stepper('dia', '\u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u062f\u0646\u064a\u0627', '\u0627\u0644\u0631\u0642\u0645 \u0627\u0644\u0623\u0635\u063a\u0631')}${stepper('pul', '\u0627\u0644\u0646\u0628\u0636', '\u0639\u062f\u062f \u0636\u0631\u0628\u0627\u062a \u0627\u0644\u0642\u0644\u0628')}</div>
      <div class="stack" style="margin-top:1rem"><button class="btn main big" id="bpSv" data-act="bpSave" type="button">${ico('check')} \u0633\u062c\u0651\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u0629</button></div>
      <div id="bpRes" style="margin-top:1rem">${lastSaved ? resultCard(lastSaved) : ''}</div></div>
    <div class="card"><h2>\u0627\u0644\u0627\u062a\u062c\u0627\u0647 \u0627\u0644\u0639\u0627\u0645</h2><div style="margin-top:.5rem">${chartSvg(list)}</div></div>
    <div class="card"><div class="row sp"><h2>\u0622\u062e\u0631 \u0627\u0644\u0642\u0631\u0627\u0621\u0627\u062a</h2><button class="btn sm" data-act="bpCopy" type="button">\u0646\u0633\u062e \u0645\u0644\u062e\u0635 \u0644\u0644\u0637\u0628\u064a\u0628</button></div>
      ${recent.length ? `<div class="stack" style="margin-top:.6rem">${recent.map(r => { const c = classify(r.sys, r.dia); return `<div class="row sp" style="border-bottom:1px solid var(--line);padding-bottom:.5rem">
        <div><b class="bignum" style="font-size:1.2rem">${r.sys}/${r.dia}</b> <span class="muted">\u0646\u0628\u0636 ${r.pul || '\u2014'}</span><br><small class="muted">${fmtDate(r.ts, { weekday: 'long', day: 'numeric', month: 'short' })} \u00b7 ${fmtClock(r.ts)}</small></div>
        <div class="row"><span class="pill ${c.tone}">${c.t}</span><button class="btn sm danger" data-act="bpDel" data-id="${r.id}" type="button" aria-label="\u062d\u0630\u0641 \u0627\u0644\u0642\u0631\u0627\u0621\u0629">\u062d\u0630\u0641</button></div></div>`; }).join('')}</div>` : '<p class="empty">\u0644\u0627 \u062a\u0648\u062c\u062f \u0642\u0631\u0627\u0621\u0627\u062a \u0628\u0639\u062f.</p>'}</div>
    <details><summary>\u0643\u064a\u0641 \u0623\u0642\u064a\u0633 \u0627\u0644\u0636\u063a\u0637 \u0628\u0634\u0643\u0644 \u0635\u062d\u064a\u062d\u061f</summary><div class="body"><ul class="clean">
      <li>\u0627\u062c\u0644\u0633 \u0639\u0644\u0649 \u0643\u0631\u0633\u064a \u0648\u0638\u0647\u0631\u0643 \u0645\u0633\u0646\u0648\u062f \u0648\u0642\u062f\u0645\u0627\u0643 \u0639\u0644\u0649 \u0627\u0644\u0623\u0631\u0636\u060c \u0648\u0644\u0627 \u062a\u0636\u0639 \u0633\u0627\u0642\u064b\u0627 \u0639\u0644\u0649 \u0633\u0627\u0642.</li><li>\u0627\u0631\u062a\u062d \u062e\u0645\u0633 \u062f\u0642\u0627\u0626\u0642 \u0642\u0628\u0644 \u0627\u0644\u0642\u064a\u0627\u0633\u060c \u0648\u062a\u062c\u0646\u0651\u0628 \u0627\u0644\u0642\u0647\u0648\u0629 \u0648\u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0648\u0627\u0644\u0631\u064a\u0627\u0636\u0629 \u0642\u0628\u0644\u0647 \u0628\u0646\u0635\u0641 \u0633\u0627\u0639\u0629.</li>
      <li>\u0636\u0639 \u0627\u0644\u0634\u0631\u064a\u0637 \u0639\u0644\u0649 \u0630\u0631\u0627\u0639 \u0639\u0627\u0631\u064a\u0629 \u0641\u064a \u0645\u0633\u062a\u0648\u0649 \u0627\u0644\u0642\u0644\u0628\u060c \u0648\u0627\u062a\u0631\u0643 \u0630\u0631\u0627\u0639\u0643 \u0645\u0631\u062a\u0627\u062d\u0629 \u0639\u0644\u0649 \u0627\u0644\u0637\u0627\u0648\u0644\u0629.</li><li>\u0644\u0627 \u062a\u062a\u062d\u062f\u062b \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0642\u064a\u0627\u0633.</li><li>\u0642\u0650\u0633 \u0645\u0631\u062a\u064a\u0646 \u0628\u064a\u0646\u0647\u0645\u0627 \u062f\u0642\u064a\u0642\u0629\u060c \u0635\u0628\u0627\u062d\u064b\u0627 \u0648\u0645\u0633\u0627\u0621\u064b\u060c \u0648\u0633\u062c\u0651\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u062a\u064a\u0646.</li></ul></div></details>`;
  $$('input[data-k]', el).forEach(i => i.addEventListener('input', () => { const v = parseInt(i.value, 10); if (!isNaN(v)) draft[i.dataset.k] = v; }));
};
ACT.bpStep = b => {
  const k = b.dataset.k, d = +b.dataset.d, inp = $('#bp-' + k);
  draft[k] = Math.min(LIM[k][1], Math.max(LIM[k][0], (parseInt(inp.value, 10) || draft[k]) + d));
  inp.value = draft[k];
};
ACT.bpSave = async () => {
  ['sys', 'dia', 'pul'].forEach(k => { const v = parseInt($('#bp-' + k).value, 10); if (!isNaN(v)) draft[k] = v; });
  const { sys, dia, pul } = draft;
  const bad = (k, v) => v < LIM[k][0] || v > LIM[k][1];
  if (bad('sys', sys) || bad('dia', dia) || bad('pul', pul) || dia >= sys) return toast('\u0631\u0627\u062c\u0639 \u0627\u0644\u0623\u0631\u0642\u0627\u0645: \u0627\u0644\u0642\u0631\u0627\u0621\u0629 \u0627\u0644\u0639\u0644\u064a\u0627 \u064a\u062c\u0628 \u0623\u0646 \u062a\u0643\u0648\u0646 \u0623\u0643\u0628\u0631 \u0645\u0646 \u0627\u0644\u062f\u0646\u064a\u0627.');
  const rec = { id: uuid(), patientId: S.id, ts: new Date().toISOString(), sys, dia, pul };
  const btn = $('#bpSv'); if (btn) btn.disabled = true;
  try {
    await DB.addBp(S.id, rec);
    S.bp.push(rec); lastSaved = rec; toast('\u062a\u0645 \u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u0642\u0631\u0627\u0621\u0629'); render();
    const r = $('#bpRes'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) { console.error(e); toast(errText(e)); if (btn) btn.disabled = false; }
};
ACT.bpDel = async b => {
  if (!await confirmDlg('\u062d\u0630\u0641 \u0647\u0630\u0647 \u0627\u0644\u0642\u0631\u0627\u0621\u0629\u061f', '\u0633\u062a\u064f\u062d\u0630\u0641 \u0645\u0646 \u0627\u0644\u0633\u062c\u0644.', '\u062d\u0630\u0641')) return;
  try { await DB.delBp(b.dataset.id); S.bp = S.bp.filter(r => r.id !== b.dataset.id); lastSaved = null; render(); }
