<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Care Line - Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one calm column, big dose ring as the hero, bottom tab bar on phones, top tabs on desktop */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#E8F0ED; --ink:#12231F; --ink-2:#3D524C; --line:#C9D7D2;
  --primary:#0B5C52; --primary-ink:#FFFFFF; --primary-soft:#D5EAE5;
  --warm:#B5381F; --warm-soft:#FBE4DE; --ok:#1B7A3C; --ok-soft:#DDF1E3; --amber:#7A4F00; --amber-soft:#FBEDCB;
  --shadow:0 1px 2px rgba(18,35,31,.08),0 6px 18px rgba(18,35,31,.06);
  --scale:1;
  --f-display:"Readex Pro","IBM Plex Sans",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1715; --surface:#14231F; --surface-2:#1B2F2A; --ink:#E9F3F0; --ink-2:#AFC4BD; --line:#2A413B;
    --primary:#5FD0BC; --primary-ink:#06211C; --primary-soft:#1D3E38;
    --warm:#FF9A84; --warm-soft:#3A1F19; --ok:#6FD595; --ok-soft:#17321F; --amber:#F2C463; --amber-soft:#382B0B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1715; --surface:#14231F; --surface-2:#1B2F2A; --ink:#E9F3F0; --ink-2:#AFC4BD; --line:#2A413B;
  --primary:#5FD0BC; --primary-ink:#06211C; --primary-soft:#1D3E38;
  --warm:#FF9A84; --warm-soft:#3A1F19; --ok:#6FD595; --ok-soft:#17321F; --amber:#F2C463; --amber-soft:#382B0B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark;
}
:root[data-scale="2"]{--scale:1.15}
:root[data-scale="3"]{--scale:1.32}
:root{font-size:calc(100% * var(--scale))}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.125rem;line-height:1.7;direction:ltr;
  padding-block:0 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.2rem;font-weight:600}
p{margin:0} small,.muted{color:var(--ink-2)}
.wrap{max-width:46rem;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.4em;height:1.4em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;padding-block:.6rem}
.brand{display:flex;align-items:center;gap:.65rem;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.35rem;display:block;line-height:1.2}
.brand span{font-size:.85rem;color:var(--ink-2);display:block;line-height:1.3}
.logo{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.tools{display:flex;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:2.75rem;padding:.35rem .9rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem}
.chip:hover{border-color:var(--primary)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:.4rem max(8px,env(safe-area-inset-left,0px)) calc(.4rem + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));display:flex;justify-content:space-around;gap:.25rem}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:3.6rem;padding:.35rem .2rem;border-radius:14px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.85rem;line-height:1.3}
.nav a svg.i{width:1.7rem;height:1.7rem}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
@media(min-width:860px){
  body{padding-block:0 3rem}
  .nav{position:static;border:0;background:none;max-width:46rem;margin:1rem auto 0;padding:0;gap:.5rem}
  .nav a{flex-direction:row;justify-content:center;gap:.5rem;font-size:1rem;border:2px solid var(--line);background:var(--surface);min-height:3.25rem}
  .nav a[aria-current="page"]{border-color:var(--primary)}
}

/* views and cards */
main{max-width:46rem;margin:1.25rem auto 0;display:flex;flex-direction:column;gap:1.1rem}
.view{display:none;flex-direction:column;gap:1.1rem} .view.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.2rem;box-shadow:var(--shadow);min-width:0}
.card.tint{background:var(--primary-soft);border-color:transparent}
.card.warn{background:var(--warm-soft);border-color:var(--warm)}
.card h2,.card h3{margin-bottom:.5rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.75rem}
.stack{display:flex;flex-direction:column;gap:.75rem}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .8rem;border-radius:999px;font-weight:700;font-size:.9rem;background:var(--surface-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--warm-soft);color:var(--warm)} .pill.mid{background:var(--amber-soft);color:var(--amber)}
.note{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:.7rem .9rem;font-size:.95rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.6rem;padding:.6rem 1.4rem;border-radius:16px;border:2px solid var(--primary);
  background:var(--surface);color:var(--primary);font-weight:700;font-size:1.1rem;text-decoration:none;line-height:1.3;text-align:center}
.btn:hover{background:var(--primary-soft)} .btn:active{transform:translateY(1px)}
.btn.main{background:var(--primary);color:var(--primary-ink)} .btn.main:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--warm);color:var(--warm)} .btn.danger.main{background:var(--warm);color:var(--surface)}
.btn.big{min-height:4.4rem;font-size:1.3rem;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:2.9rem;padding:.3rem 1rem;font-size:1rem;border-radius:12px}

/* dose ring */
.ring{position:relative;width:min(100%,17rem);aspect-ratio:1;margin-inline:auto}
.ring svg{width:100%;height:100%;display:block}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.1rem}
.ring .mid strong{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.seg{fill:none;stroke-width:20;stroke-linecap:round}
.seg.none{stroke:var(--line)} .seg.taken{stroke:var(--primary)} .seg.missed{stroke:var(--warm)} .seg.due{stroke:var(--amber)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.4rem;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:.25rem;font-size:.85rem;color:var(--ink-2)}
.dot{width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--ink-2)}
.dot.full{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.dot.part{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.dot.miss{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}
.day.today span:last-child{color:var(--ink);font-weight:700}
.dot svg.i{width:1.2rem;height:1.2rem;stroke-width:3}

/* med list */
.med{display:flex;gap:.9rem;align-items:flex-start}
.med .ic{width:3rem;height:3rem;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.med h3{margin:0}
.med .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.grow{flex:1;min-width:0}

/* tables */
.scroll{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;min-width:24rem;font-size:.95rem}
table.log th,table.log td{padding:.45rem .3rem;text-align:center;border-bottom:1px solid var(--line)}
table.log th:first-child,table.log td:first-child{text-align:start;font-weight:600}
.mk{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;font-weight:700}
.mk.t{background:var(--primary);color:var(--primary-ink)} .mk.m{background:var(--warm-soft);color:var(--warm)} .mk.p{color:var(--ink-2)}
.mk svg.i{width:1rem;height:1rem;stroke-width:3}

/* forms */
label.f{display:flex;flex-direction:column;gap:.35rem;font-weight:600}
input[type=text],input[type=number],input[type=tel],textarea,select{width:100%;min-height:3.4rem;padding:.55rem .9rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.1rem}
input:focus,textarea:focus,select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:5rem;resize:vertical}
.togs{display:flex;gap:.5rem;flex-wrap:wrap}
.tog{position:relative}
.tog input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.tog span{display:inline-flex;align-items:center;min-height:3.2rem;padding:.4rem 1.1rem;border-radius:999px;border:2px solid var(--line);font-weight:600;background:var(--surface)}
.tog input:checked+span{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tog input:focus-visible+span{outline:3px solid var(--primary);outline-offset:3px}

/* BP stepper */
.steppers{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.75rem}
.step{background:var(--surface-2);border-radius:18px;padding:.8rem;text-align:center}
.step .lbl{font-weight:600;font-size:.95rem;display:block}
.step .ctl{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-top:.3rem}
.step .ctl button{width:3.8rem;height:3.8rem;border-radius:50%;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-size:2rem;line-height:1;font-weight:700;display:grid;place-items:center;flex:none}
.step .ctl button:hover{background:var(--primary-soft)}
.step input{text-align:center;font-family:var(--f-display);font-size:2.2rem;font-weight:700;border:0;background:transparent;min-height:3.8rem;padding:0;direction:ltr;min-width:0}
.result{border-radius:18px;padding:1rem}
.result.ok{background:var(--ok-soft)} .result.mid{background:var(--amber-soft)} .result.bad{background:var(--warm-soft)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--f-body);font-size:12px}
details{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:.2rem 1rem}
details+details{margin-top:.5rem}
summary{cursor:pointer;min-height:3.2rem;display:flex;align-items:center;font-weight:700;list-style:none;gap:.5rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-inline-start:auto;font-size:1.5rem;color:var(--primary)}
details[open] summary::after{content:"\2212"}
details .body{padding-bottom:.9rem}
ul.clean{margin:0;padding-inline-start:1.3rem;display:flex;flex-direction:column;gap:.35rem}

/* chat */
.chat{display:flex;flex-direction:column;gap:.6rem;max-height:26rem;min-height:12rem;overflow-y:auto;padding:.3rem}
.msg{max-width:88%;padding:.7rem 1rem;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.nurse{background:var(--primary-soft);border-start-start-radius:4px;align-self:flex-start}
.msg.me{background:var(--primary);color:var(--primary-ink);border-start-end-radius:4px;align-self:flex-end}
.msg small{display:block;font-size:.8rem;opacity:.8;margin-bottom:.15rem}
.quick{display:flex;gap:.5rem;flex-wrap:wrap}
.quick button{min-height:3rem;padding:.3rem 1rem;border-radius:999px;border:2px solid var(--primary);background:var(--surface);color:var(--primary);font-weight:600}
.quick button:hover{background:var(--primary-soft)}
.composer{display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{min-height:3.6rem;flex:1}
.preview{max-width:100%;border-radius:16px;display:block}

/* dialog */
dialog{border:0;border-radius:22px;padding:1.3rem;max-width:min(32rem,calc(100vw - 2rem));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);direction:ltr;max-height:88vh;overflow-y:auto}
dialog::backdrop{background:rgba(5,15,12,.55)}
.toast{position:fixed;inset-inline:1rem;bottom:calc(6.2rem + env(safe-area-inset-bottom,0px));z-index:50;margin-inline:auto;max-width:28rem;background:var(--ink);color:var(--bg);padding:.8rem 1.1rem;border-radius:16px;text-align:center;font-weight:600}
@media(min-width:860px){.toast{bottom:1.5rem}}
.hero-msg{font-family:var(--f-display);font-size:1.25rem;line-height:1.6}
.tl{position:relative;display:flex;flex-direction:column;gap:.9rem;padding-inline-start:1.6rem}
.tl::before{content:"";position:absolute;inset-block:.4rem;inset-inline-start:.45rem;width:3px;background:var(--line);border-radius:3px}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;inset-inline-start:-1.6rem;top:.5rem;width:.95rem;height:.95rem;border-radius:50%;background:var(--primary);border:3px solid var(--bg)}
.empty{text-align:center;padding:1.2rem .5rem;color:var(--ink-2)}
@media(prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,transform .1s}.view.on{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* ---- Care Line additions ---- */
body:not(.in) .nav,body:not(.in) .tools,body:not(.in) main{display:none}
.nav a{position:relative}
.bdg{position:absolute;top:.15rem;inset-inline-start:calc(50% + .6rem);min-width:1.35rem;height:1.35rem;padding:0 .3rem;border-radius:999px;background:var(--warm);color:var(--surface);font-style:normal;font-size:.75rem;font-weight:700;display:grid;place-items:center;line-height:1}
.banner{display:flex;gap:.8rem;align-items:center;text-decoration:none;color:var(--ink);border:2px solid var(--primary)}
.bignum{font-family:var(--f-display);font-size:2rem;font-weight:700;direction:ltr;display:inline-block}
.kicker{display:inline-flex;align-items:center;gap:.4rem;color:var(--primary)}
.teach h2{font-size:1.3rem}
.dot.future{border-style:dashed;background:transparent;color:var(--ink-2);opacity:.8;font-weight:500}
.dot.none{border-color:transparent;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.dot.pend{border-color:var(--primary);background:transparent;color:var(--primary);font-size:.8rem}
.day.today>span:first-child{box-shadow:0 0 0 3px var(--primary-soft)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.9rem;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i.dot{width:1.1rem;height:1.1rem;display:inline-block;border-width:2px}
.authhead{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.tabs{display:flex;gap:.4rem;background:var(--surface-2);padding:.3rem;border-radius:16px;margin-bottom:1rem}
.tabs button{flex:1;min-height:3rem;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.fs{border:0;padding:0;margin:0;min-width:0}
.fs legend{font-weight:600;margin-bottom:.35rem;padding:0}
.bsel{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:.5rem}
.bsel select{padding-inline:.5rem}
.chk{display:flex;gap:.7rem;align-items:flex-start;font-size:1rem}
.chk input{width:1.6rem;height:1.6rem;margin-top:.15rem;flex:none;accent-color:var(--primary)}
.idcard{display:flex;gap:.9rem;align-items:center;background:var(--primary-soft);border-radius:18px;padding:.9rem;margin-top:.8rem}
.sep{border:0;border-top:1px solid var(--line);width:100%;margin:.2rem 0}
.msg.call{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.msg .tm{margin:.25rem 0 0;font-size:.75rem}
.msg.call small{flex-basis:100%;margin:0}
[aria-invalid="true"]{border-color:var(--warm)!important}

/* ---- Dashboard ---- */
.wrap{max-width:74rem}
main{max-width:74rem;margin-top:1.25rem}
.tools{align-items:center;flex-wrap:wrap}
.who{font-weight:600;color:var(--ink-2);font-size:.95rem}
.chip{min-height:2.5rem}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.sec-h h1{font-size:1.6rem}
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:14rem}
.search svg{position:absolute;inset-inline-start:.9rem;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.search input{padding-inline-start:2.7rem;min-height:2.9rem}
.seg-f{display:inline-flex;background:var(--surface-2);padding:.25rem;border-radius:14px;gap:.2rem}
.seg-f button{border:0;background:transparent;min-height:2.4rem;padding:.2rem .9rem;border-radius:10px;font-weight:600;color:var(--ink-2)}
.seg-f button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(21rem,1fr));gap:1rem}
.pc{position:relative;display:flex;flex-direction:column;gap:.8rem;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.pc:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 2px 4px rgba(18,35,31,.08),0 14px 30px rgba(18,35,31,.1)}
.pc.alert{border-color:var(--warm)}
.pc .head{display:flex;gap:.8rem;align-items:center}
.av{width:3rem;height:3rem;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.pc h3{font-size:1.1rem;line-height:1.3}
.sub{color:var(--ink-2);font-size:.9rem}
.unr{margin-inline-start:auto;background:var(--primary);color:var(--primary-ink);border-radius:999px;font-size:.78rem;font-weight:700;padding:.1rem .6rem;white-space:nowrap}
.alertbox{display:flex;gap:.7rem;align-items:flex-start;background:linear-gradient(135deg,var(--warm-soft),transparent 140%);border:1px solid var(--warm);border-inline-start-width:5px;border-radius:14px;padding:.65rem .8rem;color:var(--warm)}
.alertbox b{display:block;font-size:.95rem}
.alertbox span{font-size:.88rem;color:var(--ink)}
.pulse{width:.8rem;height:.8rem;border-radius:50%;background:var(--warm);flex:none;margin-top:.35rem;box-shadow:0 0 0 0 var(--warm)}
@media(prefers-reduced-motion:no-preference){.pulse{animation:pl 1.8s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(181,56,31,.5)}70%{box-shadow:0 0 0 .7rem rgba(181,56,31,0)}100%{box-shadow:0 0 0 0 rgba(181,56,31,0)}}}
.okline{display:flex;align-items:center;gap:.5rem;color:var(--ok);font-weight:600;font-size:.92rem}
.miniring{display:flex;gap:.3rem;align-items:center}
.miniring i{width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--line);display:inline-block}
.miniring i.t{background:var(--primary);border-color:var(--primary)} .miniring i.m{background:var(--warm);border-color:var(--warm)} .miniring i.d{border-color:var(--amber);background:var(--amber-soft)}
.mb{display:flex;gap:.5rem;align-items:flex-end}
.mb textarea{min-height:2.9rem;height:2.9rem;padding:.5rem .8rem;font-size:.95rem;resize:none;border-radius:12px}
.mb .btn{min-height:2.9rem;padding:.3rem 1rem;font-size:.95rem;border-radius:12px}

<script>
(function(){
"use strict";
/* ===================== Care Line: shared core (patient app + nurse dashboard) ===================== */
const CFG = window.CARELINE_CONFIG || {};
const LIVE = !!(CFG.supabaseUrl && CFG.supabaseKey);
const SUPA_SRC = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js';

const SLOTS = {
  m: { ar: '\u0627\u0644\u0635\u0628\u0627\u062d', en: 'Morning', time: '08:00' },
  n: { ar: '\u0627\u0644\u0638\u0647\u0631', en: 'Noon', time: '14:00' },
  e: { ar: '\u0627\u0644\u0645\u0633\u0627\u0621', en: 'Evening', time: '20:00' },
  b: { ar: '\u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645', en: 'Bedtime', time: '22:30' }
};
const ORDER = ['m', 'n', 'e', 'b'];
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const minutesOf = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function uuid() {
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, '0'));
  return `${h.slice(0, 4).join('')}-${h.slice(4, 6).join('')}-${h.slice(6, 8).join('')}-${h.slice(8, 10).join('')}-${h.slice(10).join('')}`;
}
function ageFrom(birth, now = new Date()) {
  if (!birth) return null;
  const [y, m, d] = String(birth).slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return null;
  let a = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) a--;
  return a;
}
function toEmail(id) {
  const s = String(id || '').trim().toLowerCase();
  return s.includes('@') ? s : s + '@' + (CFG.phoneEmailDomain || 'careline.app');
}
// Patients sign in with their phone number only; the Auth password is derived from it (Supabase requires one).
const patientPw = phone => 'cl-' + String(phone || '').trim() + '-' + (CFG.accessSalt || 'careline');
function fail(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(fail('network', 'script load failed'));
    document.head.appendChild(s);
  });
}

/* ---------- row <-> app object mapping ---------- */
const mapProfile = r => ({ id: r.id, role: r.role, name: r.full_name || '', birth: r.birth_date ? String(r.birth_date).slice(0, 10) : '', phone: r.phone || '', wa: r.whatsapp || '', barriers: r.barriers || [], createdAt: r.created_at });
const mapMed = r => ({ id: r.id, patientId: r.patient_id, name: r.name, dose: r.dose || '', slots: r.slots || [], how: r.how || '', why: r.why || '', left: r.days_left == null ? '' : r.days_left, addedAt: r.added_at, stoppedOn: r.stopped_on ? String(r.stopped_on).slice(0, 10) : null });
const mapBp = r => ({ id: r.id, patientId: r.patient_id, ts: r.measured_at, sys: r.sys, dia: r.dia, pul: r.pulse == null ? '' : r.pulse });
const mapMsg = r => ({ id: r.id, patientId: r.patient_id, r: r.sender, t: r.body, ts: r.created_at, kind: r.kind || 'text', read: !!r.read_at });
function foldLogs(rows) {
  const map = {};
  for (const r of rows) {
    const day = String(r.day).slice(0, 10);
    (map[day] = map[day] || {})[r.slot] = { s: r.status === 'taken' ? 't' : 's', at: r.taken_at, meds: r.meds || [] };
  }
  return map;
}

/* ---------- adherence logic (identical in both apps) ---------- */
const Adh = {
  expectedSlots(meds, day) {
    const set = new Set();
    for (const m of meds) {
      const addedDay = dk(new Date(m.addedAt));
      if (day < addedDay) continue;
      if (m.stoppedOn && day >= m.stoppedOn) continue;
      for (const s of m.slots) {
        if (day === addedDay) {
          const at = new Date(m.addedAt);
          if (minutesOf(SLOTS[s].time) + 120 <= at.getHours() * 60 + at.getMinutes()) continue;
        }
        set.add(s);
      }
    }
    return ORDER.filter(s => set.has(s));
  },
  slotStatus(logs, day, slot, now = new Date()) {
    const e = (logs[day] || {})[slot];
    if (e) return e.s === 't' ? 't' : 's';
    const today = dk(now);
    if (day < today) return 'm';
    if (day > today) return 'p';
    const cur = now.getHours() * 60 + now.getMinutes(), t = minutesOf(SLOTS[slot].time);
    if (cur > t + 120) return 'm';
    return cur >= t - 30 ? 'd' : 'p';
  },
  dayInfo(meds, logs, day, now = new Date()) {
    const today = dk(now), exp = this.expectedSlots(meds, day);
    const st = exp.map(s => this.slotStatus(logs, day, s, now));
    const taken = st.filter(x => x === 't').length, failed = st.filter(x => x === 'm' || x === 's').length;
    let state = 'none';
    if (day > today) state = 'future';
    else if (!exp.length) state = 'none';
    else if (failed > 0) state = 'miss';
    else if (taken === exp.length) state = 'full';
    else if (day === today) state = taken > 0 ? 'progress' : 'pending';
    return { day, exp, st, taken, failed, total: exp.length, counted: taken + failed, state };
  },
  range(meds, logs, fromDay, toDay, now = new Date()) {
    const days = []; let d = new Date(fromDay + 'T12:00:00');
    const end = new Date(toDay + 'T12:00:00');
    while (d <= end) { days.push(this.dayInfo(meds, logs, dk(d), now)); d = addDays(d, 1); }
    const taken = days.reduce((a, x) => a + x.taken, 0), counted = days.reduce((a, x) => a + x.counted, 0);
    return { days, taken, counted, pct: counted ? Math.round(taken / counted * 100) : null };
  },
  lastDays(meds, logs, n, now = new Date()) { return this.range(meds, logs, dk(addDays(now, -(n - 1))), dk(now), now); },
  streak(meds, logs, now = new Date()) {
    let n = 0;
    for (let i = 0; i < 120; i++) {
      const info = this.dayInfo(meds, logs, dk(addDays(now, -i)), now);
      if (i === 0) { if (info.state === 'full') n++; else if (info.state === 'miss') break; continue; }
      if (info.state === 'full') n++; else break;
    }
    return n;
  },
  missedToday(meds, logs, now = new Date()) {
    const info = this.dayInfo(meds, logs, dk(now), now);
    return info.exp.filter((s, i) => info.st[i] === 'm' || info.st[i] === 's');
  }
};


/* ===================== Backend 1: Supabase ===================== */
function mapDbErr(e) {
  const m = String((e && e.message) || e || '').toLowerCase();
  if (m.includes('fetch') || m.includes('network') || m.includes('timeout')) return fail('network', e.message);
  if ((e && e.code === '42501') || m.includes('row-level security') || m.includes('permission denied')) return fail('denied', e.message);
  return fail('db', e && e.message);
}
function mapAuthErr(e) {
  const m = String((e && e.message) || e || '').toLowerCase();
  if (m.includes('invalid login')) return fail('bad_credentials');
  if (m.includes('already registered') || m.includes('already been registered')) return fail('exists');
  if (m.includes('password') && (m.includes('least') || m.includes('weak'))) return fail('weak_password');
  if (m.includes('email') && (m.includes('invalid') || m.includes('not allowed'))) return fail('bad_email', e.message);
  if (m.includes('rate limit') || m.includes('too many')) return fail('rate');
  if (m.includes('fetch') || m.includes('network')) return fail('network', e.message);
  return fail('auth', e && e.message);
}
const chk = ({ data, error }) => { if (error) throw mapDbErr(error); return data; };

const SBX = {
  live: true, c: null,
  async init() {
    await loadScript(SUPA_SRC);
    if (!window.supabase || !window.supabase.createClient) throw fail('network', 'supabase-js missing');
    this.c = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  },
  async _ctx(id) { const r = chk(await this.c.from('profiles').select('*').eq('id', id).single()); return { id, role: r.role, profile: mapProfile(r) }; },
  async session() {
    const { data, error } = await this.c.auth.getSession();
    if (error || !data.session) return null;
    try { return await this._ctx(data.session.user.id); } catch (e) { if (e.code === 'network') throw e; return null; }
  },
  async signUp(p) {
    const { data, error } = await this.c.auth.signUp({ email: toEmail(p.phone), password: p.password, options: { data: { full_name: p.name, birth_date: p.birth, phone: p.phone, whatsapp: p.wa } } });
    if (error) throw mapAuthErr(error);
    if (!data.session) throw fail('confirm_required');
    return this._ctx(data.user.id);
  },
  async signIn(idf, pw) {
    const { data, error } = await this.c.auth.signInWithPassword({ email: toEmail(idf), password: pw });
    if (error) throw mapAuthErr(error);
    return this._ctx(data.user.id);
  },
  async signOut() { await this.c.auth.signOut(); },
  async updateProfile(id, patch) {
    const row = {};
    if ('name' in patch) row.full_name = patch.name;
    if ('birth' in patch) row.birth_date = patch.birth || null;
    if ('phone' in patch) row.phone = patch.phone;
    if ('wa' in patch) row.whatsapp = patch.wa;
    if ('barriers' in patch) row.barriers = patch.barriers;
    const { error } = await this.c.from('profiles').update(row).eq('id', id);
    if (error) throw mapDbErr(error);
  },
  async meds(pid) { return chk(await this.c.from('medications').select('*').eq('patient_id', pid).order('added_at', { ascending: true })).map(mapMed); },
  medRow(pid, m) { return { patient_id: pid, name: m.name, dose: m.dose || '', slots: m.slots, how: m.how || '', why: m.why || '', days_left: m.left === '' || m.left == null ? null : Number(m.left) }; },
  async addMed(pid, m) { const { error } = await this.c.from('medications').insert({ id: m.id, added_at: m.addedAt, ...this.medRow(pid, m) }); if (error) throw mapDbErr(error); },
  async updateMed(pid, m) { const { error } = await this.c.from('medications').update(this.medRow(pid, m)).eq('id', m.id); if (error) throw mapDbErr(error); },
  async stopMed(id, day) { const { error } = await this.c.from('medications').update({ stopped_on: day }).eq('id', id); if (error) throw mapDbErr(error); },
  async logs(pid, fromDay) { return foldLogs(chk(await this.c.from('dose_logs').select('*').eq('patient_id', pid).gte('day', fromDay))); },
  async setLog(pid, day, slot, s, at, meds) {
    const { error } = await this.c.from('dose_logs').upsert({ patient_id: pid, day, slot, status: s === 't' ? 'taken' : 'skipped', taken_at: at, meds }, { onConflict: 'patient_id,day,slot' });
    if (error) throw mapDbErr(error);
  },
  async bpList(pid) { return chk(await this.c.from('bp_readings').select('*').eq('patient_id', pid).order('measured_at', { ascending: false }).limit(200)).map(mapBp); },
  async addBp(pid, r) { const { error } = await this.c.from('bp_readings').insert({ id: r.id, patient_id: pid, measured_at: r.ts, sys: r.sys, dia: r.dia, pulse: r.pul === '' ? null : r.pul }); if (error) throw mapDbErr(error); },
  async delBp(id) { const { error } = await this.c.from('bp_readings').delete().eq('id', id); if (error) throw mapDbErr(error); },
  async messages(pid) { return chk(await this.c.from('messages').select('*').eq('patient_id', pid).order('created_at', { ascending: false }).limit(200)).reverse().map(mapMsg); },
  async send(pid, sender, body, kind = 'text') { return mapMsg(chk(await this.c.from('messages').insert({ patient_id: pid, sender, body, kind }).select().single())); },
  async markRead(pid) { const { error } = await this.c.rpc('mark_thread_read', { p: pid }); if (error) throw mapDbErr(error); },
  async changePassword(pw) { const { error } = await this.c.auth.updateUser({ password: pw }); if (error) throw mapAuthErr(error); },

/* ---------- blood pressure (same bands as the patient app) ---------- */
function classify(sys, dia) {
  if (sys < 90 || dia < 60) return { t: 'Low', tone: 'mid' };
  if (sys >= 180 || dia >= 120) return { t: 'Very high', tone: 'bad' };
  if (sys >= 140 || dia >= 90) return { t: 'High (stage 2)', tone: 'bad' };
  if (sys >= 130 || dia >= 80) return { t: 'Elevated (stage 1)', tone: 'mid' };
  if (sys >= 120) return { t: 'Slightly raised', tone: 'mid' };
  return { t: 'Normal', tone: 'ok' };
}

/* ---------- adherence helpers ---------- */
const pctTone = p => p === null ? '' : p >= 80 ? 'ok' : p >= 60 ? 'mid' : 'bad';
const pctTxt = p => p === null ? '\u2014' : p + '%';
function schedFor(meds, day, slot) {
  return meds.filter(m => m.slots.includes(slot) && dk(new Date(m.addedAt)) <= day && !(m.stoppedOn && day >= m.stoppedOn));
}
function medStats(m, logs, fromDay, toDay, now) {
  let t = 0, c = 0, d = new Date(fromDay + 'T12:00:00'); const end = new Date(toDay + 'T12:00:00');
  while (d <= end) {
    const day = dk(d);
    for (const s of Adh.expectedSlots([m], day)) {
      const st = Adh.slotStatus(logs, day, s, now);
      if (st === 't') { t++; c++; } else if (st === 'm' || st === 's') c++;
    }
    d = addDays(d, 1);
  }
  return { taken: t, counted: c, pct: c ? Math.round(t / c * 100) : null };
}
function todayView(meds, logs, now) {
  const info = Adh.dayInfo(meds, logs, dk(now), now);
  return { info, missed: Adh.missedToday(meds, logs, now) };
}
function patientAlertText(meds, missed) {
  return missed.map(s => {
    const names = meds.filter(m => m.slots.includes(s)).map(m => m.name).join(', ');
    return SLN[s] + (names ? ` (${names})` : '');
  }).join(' \u00b7 ');
}

/* ---------- data ---------- */
async function loadList() {
  const now = new Date(), day = dk(now);
  const [pts, meds, logs, unread] = await Promise.all([DB.patients(), DB.activeMeds(), DB.logsOn(day), DB.unread()]);
  N.patients = pts; N.unread = unread;
  N.meds = {}; meds.forEach(m => { (N.meds[m.patientId] = N.meds[m.patientId] || []).push(m); });
  N.today = {}; logs.forEach(l => { const o = (N.today[l.patientId] = N.today[l.patientId] || {}); (o[l.day] = o[l.day] || {})[l.slot] = { s: l.s, at: l.at, meds: l.meds }; });
  N.loaded = true;
}
async function loadDetail(id) {
  const from = dk(addDays(new Date(), -120));
  const [meds, logs, bp, chat] = await Promise.all([DB.meds(id), DB.logs(id, from), DB.bpList(id), DB.messages(id)]);
  return { meds, logs, bp: bp.sort((a, b) => new Date(a.ts) - new Date(b.ts)), chat };
}

/* ===================== Section 1: patient cards ===================== */
function cardData(p, now) {
  const meds = N.meds[p.id] || [], logs = N.today[p.id] || {};
  const { info, missed } = todayView(meds, logs, now);
  return { p, meds, info, missed, unread: N.unread[p.id] || 0 };
}
function cardHtml(c) {

    <form class="mb" data-id="${p.id}" novalidate><label class="sr" for="mb-${p.id}">Message to ${esc(p.name)}</label>
      <textarea id="mb-${p.id}" rows="1" maxlength="1000" placeholder="Message ${esc(first(p.name))}\u2026">${esc(N.drafts[p.id] || '')}</textarea>
      <button class="btn main" type="submit" aria-label="Send message to ${esc(p.name)}">${ico('send')}</button></form></article>`;
}
function filtered(now) {
  const q = N.q.trim().toLowerCase(), qd = dig(q);
  let rows = N.patients.map(p => cardData(p, now));
  if (q) rows = rows.filter(c => c.p.name.toLowerCase().includes(q) || c.p.phone.includes(qd));
  if (N.filter === 'alert') rows = rows.filter(c => c.missed.length);
  if (N.filter === 'unread') rows = rows.filter(c => c.unread);
  rows.sort((a, b) => (b.missed.length > 0) - (a.missed.length > 0) || (b.unread > 0) - (a.unread > 0) || a.p.name.localeCompare(b.p.name));
  return rows;
}
function renderList(full) {
  const el = $('#s-list'), now = new Date();
  if (full || !$('#pgrid')) {
    el.innerHTML = `<div class="sec-h"><div><h1>Patients</h1><p class="muted" id="lsub"></p></div>
      <div class="toolbar"><div class="search">${ico('search')}<input type="search" id="q" placeholder="Search by name or phone" aria-label="Search patients" value="${esc(N.q)}"></div>
      <div class="seg-f" role="group" aria-label="Filter" id="flt"></div></div></div>
      <div class="pgrid" id="pgrid" style="margin-top:1rem"></div>`;

  }

}
function paintGrid() {
  const now = new Date(), all = N.patients.map(p => cardData(p, now));
  const nAlert = all.filter(c => c.missed.length).length, nUn = all.filter(c => c.unread).length;
  const flt = $('#flt'); if (!flt) return;
  flt.innerHTML = [['all', `All (${all.length})`], ['alert', `Missed dose (${nAlert})`], ['unread', `Unread (${nUn})`]].map(f => `<button type="button" data-f="${f[0]}" aria-pressed="${N.filter === f[0]}">${f[1]}</button>`).join('');
  $$('button', flt).forEach(b => b.addEventListener('click', () => { N.filter = b.dataset.f; paintGrid(); }));
  $('#lsub').textContent = nAlert ? `${nAlert} patient${nAlert > 1 ? 's' : ''} missed a dose today` : 'Everyone is on track today';
  // preserve focus and caret inside a card's message box across repaints
  const ae = document.activeElement, keep = ae && ae.tagName === 'TEXTAREA' && ae.closest('#pgrid') ? { id: ae.closest('form').dataset.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const rows = filtered(now), g = $('#pgrid');

  wireCards(g);
  if (keep) { const t = $(`#mb-${keep.id}`); if (t) { t.focus(); try { t.setSelectionRange(keep.s, keep.e); } catch (e) { /* ignore */ } } }

function wireCards(g) {
  $$('.pc', g).forEach(card => {
    const id = card.dataset.id;
    card.addEventListener('click', e => { if (!e.target.closest('textarea,button,form')) location.hash = '#/p/' + id; });
    card.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); location.hash = '#/p/' + id; } });
    const ta = $('textarea', card);
    ta.addEventListener('input', () => { N.drafts[id] = ta.value; ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 130) + 'px'; });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form', card).requestSubmit(); } });
    if (ta.value) ta.style.height = Math.min(ta.scrollHeight, 130) + 'px';
    $('form', card).addEventListener('submit', async e => {
      e.preventDefault();
      const text = ta.value.trim(); if (!text) return;
      const btn = $('button', card); btn.disabled = true;
      try { await DB.send(id, 'nurse', text); N.drafts[id] = ''; ta.value = ''; ta.style.height = ''; const p = N.patients.find(x => x.id === id); toast('Message sent to ' + first(p && p.name)); }
      catch (ex) { console.error(ex); toast(errText(ex)); }
      finally { btn.disabled = false; }
    });
  });
}

/* ===================== Section 2: patient detail ===================== */
function weekStart(now, off) { return addDays(addDays(now, -((now.getDay() + 1) % 7)), off * 7); }
function statusChip(st) {
  return st === 't' ? `<span class="st t">${ico('check')} Taken</span>` : st === 'm' ? `<span class="st m">${ico('x')} Missed</span>` : st === 's' ? `<span class="st s">${ico('x')} Skipped</span>`
    : st === 'd' ? `<span class="st d">${ico('clock')} Due now</span>` : `<span class="st p">Upcoming</span>`;
}
function weekGrid(D, now, off) {
  const start = weekStart(now, off), days = Array.from({ length: 7 }, (_, i) => addDays(start, i)), today = dk(now);
  const rows = days.map(d => {
    const day = dk(d), info = Adh.dayInfo(D.meds, D.logs, day, now);
    const cells = ORDER.map(s => {
      const i = info.exp.indexOf(s);
      if (i < 0) return `<td><span class="dash">\u2014</span></td>`;
      const st = info.st[i], e = (D.logs[day] || {})[s];
      const list = (st === 't' && e && e.meds && e.meds.length ? e.meds : schedFor(D.meds, day, s)).map(m => `${esc(m.name)}${m.dose ? ' ' + esc(m.dose) : ''}`);
      return `<td><div class="cell">${statusChip(st)}${st === 't' && e && e.at ? `<span>at ${fmtC(e.at)}</span>` : ''}<span class="meds">${list.join('<br>') || '\u2014'}</span></div></td>`;
    }).join('');
    const pct = info.counted ? Math.round(info.taken / info.counted * 100) : null;
    return `<tr class="${day === today ? 'today' : ''}"><td>${fmtD(d)}</td>${cells}<td>${day > today ? '<span class="sub">Upcoming</span>' : info.counted ? `<b>${info.taken}/${info.counted}</b><div class="bar ${pctTone(pct) === 'ok' ? '' : pctTone(pct)}"><i style="width:${pct}%"></i></div>` : '<span class="dash">\u2014</span>'}</td></tr>`;
  }).join('');
  return { days, html: `<div class="scroll"><table class="wk"><thead><tr><th>Day</th>${ORDER.map(s => `<th>${SLN[s]}<br><span style="text-transform:none;letter-spacing:0">${fmtT(SLOTS[s].time)}</span></th>`).join('')}<th>Day total</th></tr></thead><tbody>${rows}</tbody></table></div>` };
}
function bpChart(list) {
  const pts = list.slice(-14);
  if (pts.length < 2) return '<p class="muted">At least two readings are needed to draw a trend.</p>';
  const W = 620, H = 240, Lm = 40, R = 14, T = 16, B = 34;
  const all = pts.flatMap(p => [p.sys, p.dia]).concat([130, 80]);
  const lo = Math.floor((Math.min(...all) - 6) / 10) * 10, hi = Math.ceil((Math.max(...all) + 6) / 10) * 10;
  const x = i => Lm + (W - Lm - R) * (i / (pts.length - 1)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = k => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p[k]).toFixed(1)}`).join('');
  let grid = ''; for (let v = lo; v <= hi; v += 20) grid += `<line x1="${Lm}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${Lm - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const ticks = pts.map((p, i) => (i === 0 || i === pts.length - 1 || i % 3 === 0) ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${fmtD(p.ts, { day: 'numeric', month: 'short' })}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blood pressure trend, last ${pts.length} readings">${grid}
    <line x1="${Lm}" x2="${W - R}" y1="${y(130)}" y2="${y(130)}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="${Lm}" x2="${W - R}" y1="${y(80)}" y2="${y(80)}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <path d="${line('sys')}" fill="none" stroke="var(--warm)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="${line('dia')}" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.sys)}" r="3.8" fill="var(--warm)"/><circle cx="${x(i)}" cy="${y(p.dia)}" r="3.8" fill="var(--ink)"/>`).join('')}${ticks}</svg>
    <div class="row sub" style="margin-top:.3rem"><span><b style="color:var(--warm)">\u2501</b> Systolic</span><span><b>\u2501</b> Diastolic</span><span>Dashed lines: 130/80 target</span></div>`;
}
function overallRange(D, now) {
  if (!D.meds.length) return null;
  const firstDay = D.meds.map(m => dk(new Date(m.addedAt))).sort()[0];
  const from = firstDay < dk(addDays(now, -120)) ? dk(addDays(now, -120)) : firstDay;
  return { from, r: Adh.range(D.meds, D.logs, from, dk(now), now) };
}

        <dt>Phone</dt><dd dir="ltr" style="text-align:start">${esc(p.phone)}</dd><dt>WhatsApp</dt><dd dir="ltr" style="text-align:start">${esc(p.wa || p.phone)}</dd><dt>Registered</dt><dd>${p.createdAt ? fmtDY(p.createdAt) : '\u2014'}</dd>
        <dt>Reported barriers</dt><dd>${(p.barriers || []).length ? p.barriers.map(b => `<span class="pill" style="margin:.1rem">${esc(BAR[b] || b)}</span>`).join('') : '\u2014'}</dd></dl></div></div>
      <div class="card"><div class="row sp"><h2>Latest blood pressure</h2>${c ? `<span class="pill ${c.tone}">${c.t}</span>` : ''}</div>
        ${last ? `<p style="margin-top:.4rem"><span class="bignum">${last.sys}/${last.dia}</span> <span class="muted">pulse ${last.pul || '\u2014'} \u00b7 ${fmtD(last.ts)} ${fmtC(last.ts)}</span></p>` : '<p class="muted" style="margin-top:.4rem">No readings recorded yet.</p>'}</div>`;
  }
  if (tab === 'adherence') {
    const off = N.det.week, ws = weekStart(now, off), g = weekGrid(D, now, off), r = Adh.range(D.meds, D.logs, dk(ws), dk(addDays(ws, 6)), now);
    const perMed = D.meds.map(m => ({ m, s: medStats(m, D.logs, dk(addDays(now, -29)), key, now) }));
    return `<div class="card"><div class="row sp"><div><h2>Weekly adherence</h2><p class="muted">${fmtD(ws, { day: 'numeric', month: 'short' })} \u2013 ${fmtD(addDays(ws, 6), { day: 'numeric', month: 'short', year: 'numeric' })}</p></div>
      <div class="weeknav"><span class="pill ${pctTone(r.pct)}">${r.pct === null ? 'No doses counted' : `${r.pct}% \u00b7 ${r.taken}/${r.counted} doses`}</span>
      <button type="button" data-wk="-1" aria-label="Previous week">${ico('back')}</button><button type="button" data-wk="1" aria-label="Next week" ${off >= 0 ? 'disabled' : ''}>${ico('next')}</button></div></div>
      <div style="margin-top:.6rem">${g.html}</div></div>
      <div class="kpis">${kpi('Last 7 days', pctTxt(w7.pct), pctTone(w7.pct), `${w7.taken} of ${w7.counted} doses`)}${kpi('Last 30 days', pctTxt(w30.pct), pctTone(w30.pct), `${w30.taken} of ${w30.counted} doses`)}${kpi('Overall', ov ? pctTxt(ov.r.pct) : '\u2014', ov ? pctTone(ov.r.pct) : '', ov ? `${ov.r.taken} of ${ov.r.counted} doses` : '')}</div>
      <div class="card"><h2>By medicine \u00b7 last 30 days</h2>${perMed.length ? `<div class="scroll"><table class="tbl" style="margin-top:.5rem"><thead><tr><th>Medicine</th><th>Schedule</th><th>Taken</th><th style="min-width:9rem">Adherence</th></tr></thead><tbody>${perMed.map(x => `<tr><td><b>${esc(x.m.name)}</b> ${esc(x.m.dose)}${x.m.stoppedOn ? ' <span class="pill">Stopped</span>' : ''}</td><td>${x.m.slots.map(s => SLN[s]).join(', ')}</td><td>${x.s.taken}/${x.s.counted}</td>
        <td>${x.s.pct === null ? '\u2014' : `<div class="row" style="flex-wrap:nowrap"><b style="min-width:2.6rem">${x.s.pct}%</b><div class="bar ${pctTone(x.s.pct) === 'ok' ? '' : pctTone(x.s.pct)}" style="flex:1"><i style="width:${x.s.pct}%"></i></div></div>`}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No medicines registered.</p>'}</div>`;
  }
  if (tab === 'meds') {
    const rows = D.meds.slice().sort((a, b) => (!!a.stoppedOn) - (!!b.stoppedOn) || a.name.localeCompare(b.name));
    return `<div class="card"><h2>Medications</h2><p class="muted">${act.length} active \u00b7 ${D.meds.length - act.length} stopped</p>${rows.length ? `<div class="scroll"><table class="tbl" style="margin-top:.5rem"><thead><tr><th>Medicine</th><th>Dose</th><th>Schedule</th><th>Instructions</th><th>Supply</th><th>Started</th><th>Status</th></tr></thead><tbody>${rows.map(m => `<tr><td><b>${esc(m.name)}</b>${m.why ? `<br><span class="sub">For: ${esc(m.why)}</span>` : ''}</td><td>${esc(m.dose) || '\u2014'}</td>
      <td>${m.slots.map(s => `${SLN[s]} <span class="sub">${fmtT(SLOTS[s].time)}</span>`).join('<br>')}</td><td>${esc(m.how) || '\u2014'}</td>
      <td>${m.left === '' ? '\u2014' : `<span class="pill ${m.left <= 7 ? 'bad' : ''}">${m.left} day${m.left == 1 ? '' : 's'} left</span>`}</td><td>${fmtDY(m.addedAt)}</td>
      <td>${m.stoppedOn ? `<span class="pill">Stopped ${fmtD(m.stoppedOn + 'T12:00:00', { day: 'numeric', month: 'short' })}</span>` : '<span class="pill ok">Active</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="margin-top:.5rem">The patient has not registered any medicine yet.</p>'}</div>`;
  }
  if (tab === 'bp') {
    const r14 = D.bp.slice(-14), av = k => r14.length ? Math.round(r14.reduce((a, x) => a + (+x[k] || 0), 0) / r14.length) : null, list = D.bp.slice().reverse().slice(0, 30);
    return `<div class="kpis">${kpi('Readings', D.bp.length)}${kpi('Average (last 14)', r14.length ? av('sys') + '/' + av('dia') : '\u2014')}${kpi('Highest (last 14)', r14.length ? Math.max(...r14.map(x => x.sys)) + '/' + Math.max(...r14.map(x => x.dia)) : '\u2014')}</div>
      <div class="card"><h2>Trend</h2><div style="margin-top:.5rem">${bpChart(D.bp)}</div></div>
      <div class="card"><h2>Readings</h2>${list.length ? `<div class="scroll"><table class="tbl" style="margin-top:.5rem"><thead><tr><th>Date</th><th>Reading</th><th>Pulse</th><th>Category</th></tr></thead><tbody>${list.map(r => { const c = classify(r.sys, r.dia); return `<tr><td>${fmtD(r.ts)} \u00b7 ${fmtC(r.ts)}</td><td><b>${r.sys}/${r.dia}</b></td><td>${r.pul || '\u2014'}</td><td><span class="pill ${c.tone}">${c.t}</span></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted" style="margin-top:.5rem">No readings recorded yet.</p>'}</div>`;
  }
  /* messages */
  return `<div class="card"><h2>Conversation with ${esc(first(p.name))}</h2><div class="chat" id="thread" role="log" aria-live="polite" style="margin-top:.6rem"></div></div>
    <div class="card stack"><div class="tpl">${['Please take your dose now, and tell me once you have.', 'How are you feeling after the medicine?', 'Please measure your blood pressure and send me the reading.', 'I will call you shortly.'].map(x => `<button type="button" data-tpl="${esc(x)}">${esc(x.length > 38 ? x.slice(0, 36) + '\u2026' : x)}</button>`).join('')}</div>
      <form id="tf" class="composer" novalidate><textarea id="tt" rows="2" maxlength="1000" aria-label="Message" placeholder="Write a message to ${esc(first(p.name))}">${esc(N.drafts[p.id] || '')}</textarea><button class="btn main" id="ts" type="submit">${ico('send')} Send</button></form></div>`;
}
function threadHtml(chat) {
  if (!chat.length) return '<p class="empty">No messages yet.</p>';
  return chat.map(m => {
    const t = fmtD(m.ts, { day: 'numeric', month: 'short' }) + ' \u00b7 ' + fmtC(m.ts);
    if (m.kind === 'call') return `<div class="msg call pt">${ico('phone')} <b>Requested a call</b><span class="tm">${t}</span></div>`;
    return `<div class="msg ${m.r === 'nurse' ? 'nurse' : 'pt'}">${esc(m.t)}<span class="tm">${m.r === 'nurse' ? 'You \u00b7 ' : ''}${t}</span></div>`;
  }).join('');
}
function drawThread(force) {
  const box = $('#thread'); if (!box || !N.det || !N.det.data) return;
  const near = force || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = threadHtml(N.det.data.chat); if (near) box.scrollTop = box.scrollHeight;
}
function wireTab(tab, p, D) {
  if (tab === 'adherence') $$('[data-wk]').forEach(b => b.addEventListener('click', () => { N.det.week = Math.min(0, N.det.week + +b.dataset.wk); renderDetail(); }));
  if (tab === 'msgs') {
    drawThread(true); markThread(p.id);
    const tt2 = $('#tt'); tt2.addEventListener('input', () => { N.drafts[p.id] = tt2.value; });
    tt2.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#tf').requestSubmit(); } });
    $$('[data-tpl]').forEach(b => b.addEventListener('click', () => { tt2.value = (tt2.value ? tt2.value.trim() + ' ' : '') + b.dataset.tpl; N.drafts[p.id] = tt2.value; tt2.focus(); }));
    $('#tf').addEventListener('submit', async e => {
      e.preventDefault();
      const text = tt2.value.trim(); if (!text) return;
      const b = $('#ts'); b.disabled = true;
      try { const m = await DB.send(p.id, 'nurse', text); D.chat.push(m); N.drafts[p.id] = ''; tt2.value = ''; drawThread(true); }
      catch (ex) { console.error(ex); toast(errText(ex)); } finally { b.disabled = false; }
    });
  }
}
function markThread(id) {
  if (!N.unread[id]) return;
  delete N.unread[id];
  if (N.det && N.det.data) N.det.data.chat.forEach(m => { if (m.r === 'patient') m.read = true; });
  DB.markRead(id).catch(e => console.error(e));
  $$('.tabs2 .unr').forEach(x => x.remove());
}

/* ===================== routing / polling / auth ===================== */
async function route() {
  if (!N.me) return;
  const m = (location.hash || '').match(/^#\/p\/([^/]+)(?:\/(\w+))?/);
  const sl = $('#s-list'), sd = $('#s-detail');
  if (!m) {
    N.det = null; sd.hidden = true; sl.hidden = false; sd.innerHTML = '';
    try { await loadList(); } catch (e) { toast(errText(e)); }
    renderList(true); window.scrollTo(0, 0); return;
  }
  const id = m[1], tab = TABS.some(t => t[0] === m[2]) ? m[2] : 'overview';
  sl.hidden = true; sd.hidden = false;
  const same = N.det && N.det.id === id;
  if (!same) { N.det = { id, tab, week: 0, data: null }; if (!N.loaded) { try { await loadList(); } catch (e) { toast(errText(e)); } } renderDetail(); window.scrollTo(0, 0); }
  else { N.det.tab = tab; renderDetail(); }
  if (!N.det.data || !same) {
    try { const data = await loadDetail(id); if (N.det && N.det.id === id) { N.det.data = data; renderDetail(); } }
    catch (e) { console.error(e); toast(errText(e)); }
  }
}
async function poll() {
  if (!N.me || busy || document.hidden || dlg.open) return;
  busy = true;
  try {
    if (N.det) {
      await loadList();
      const data = await loadDetail(N.det.id), old = N.det.data;
      N.det.data = data;
      const sig = d => JSON.stringify([d.chat.length, d.bp.length, d.meds.length, Object.values(d.logs).reduce((n, x) => n + Object.keys(x).length, 0)]);
      const ae = document.activeElement;
      if (N.det.tab === 'msgs') { if (old && data.chat.length !== old.chat.length) { drawThread(); markThread(N.det.id); } }
      else if (old && sig(old) !== sig(data) && !(ae && ae.matches && ae.matches('textarea,input'))) renderDetail();
    } else { await loadList(); paintGrid(); }
  } catch (e) { /* retry on next cycle */ } finally { busy = false; }
}
async function enter(ctx) {
  if (ctx.role !== 'nurse') { try { await DB.signOut(); } catch (e) { /* ignore */ } throw fail('not_nurse', 'not a nurse'); }
  N.me = ctx; N.loaded = false; closeDlg(); document.body.classList.add('in');
  $('#who').textContent = ctx.profile.name || 'Nurse';
  clearInterval(pollT); pollT = setInterval(poll, 12000);
  await route();
}
function showLogin() {
  const demo = !LIVE ? `<p class="note" style="font-size:.9rem">Demo version: sign in with <b>nurse@careline.demo</b> and password <b>123456</b>.</p>` : '';
  openDlg(`<div class="authhead"><div class="logo" aria-hidden="true">${ico('pulse')}</div><div><h2 id="dlgT">Care Line - Dashboard</h2><small class="muted">Nurse sign in</small></div></div>
    <form id="lf" class="stack" novalidate><label class="f">Email<input type="email" id="le" autocomplete="username" placeholder="name@hospital.org"></label>
      <label class="f">Password<input type="password" id="lp" autocomplete="current-password"></label>
      <p class="note" id="lerr" role="alert" hidden></p><button class="btn main big" id="lb" type="submit">Sign in</button>${demo}</form>`, d => {
    $('#le', d).focus();
    $('#lf', d).addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#lerr', d); err.hidden = true;
      const em = $('#le', d).value.trim(), pw = $('#lp', d).value;
      if (!em || !pw) { err.textContent = 'Enter your email and password.'; err.hidden = false; return; }
      const b = $('#lb', d); b.disabled = true;
      try { await enter(await DB.signIn(em, pw)); }
      catch (ex) { if (!['bad_credentials', 'not_nurse'].includes(ex.code)) console.error(ex); b.disabled = false; err.textContent = errText(ex); err.hidden = false; }
    });
  });
}
$('#btnOut').addEventListener('click', async () => {
  try { await DB.signOut(); } catch (e) { console.error(e); }
  clearInterval(pollT); Object.assign(N, { me: null, patients: [], meds: {}, today: {}, unread: {}, drafts: {}, det: null, loaded: false });
  document.body.classList.remove('in'); $('#s-list').innerHTML = ''; $('#s-detail').innerHTML = ''; showLogin();
});
dlg.addEventListener('cancel', e => { if (!N.me) e.preventDefault(); });
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
(async function boot() {
  loadUi(); applyTheme();
  try {
    await DB.init(); const ctx = await DB.session();
    if (ctx && ctx.role === 'nurse') await enter(ctx); else { if (ctx) await DB.signOut(); showLogin(); }
  } catch (e) {
    console.error(e);
    openDlg(`<h2 id="dlgT">Could not open the dashboard</h2><p style="margin:.6rem 0 1rem">${esc(errText(e))}</p><button class="btn main" id="rt" type="button">Try again</button>`, d => { $('#rt', d).onclick = () => location.reload(); });
  }
})();

})();
</script>
</body>
